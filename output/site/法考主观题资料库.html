  <style>

:root {
  color-scheme: light;
  --ink: #12221b;
  --ink-2: #2c3a34;
  --muted: #69766f;
  --paper: #f3f0e7;
  --paper-2: #ebe7dc;
  --surface: #fffef9;
  --surface-2: #f8f7f1;
  --line: rgba(24, 55, 42, .14);
  --line-strong: rgba(24, 55, 42, .24);
  --green: #0f4b35;
  --green-2: #1f6b4c;
  --green-3: #dfece4;
  --gold: #a56d21;
  --gold-soft: #f4ead7;
  --red: #a34738;
  --red-soft: #f4e4df;
  --blue: #345f6f;
  --shadow: 0 32px 90px rgba(22, 43, 34, .09);
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--paper); scroll-padding-top: 110px; }
body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(rgba(17, 54, 38, .025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(17, 54, 38, .025) 1px, transparent 1px),
    radial-gradient(circle at 92% 0, rgba(169, 113, 35, .13), transparent 31rem),
    var(--paper);
  background-size: 44px 44px, 44px 44px, auto, auto;
  font-family: var(--sans);
  text-rendering: optimizeLegibility;
}
button, input, select { min-height: 44px; font: inherit; }
button, summary, a, select { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button { color: inherit; }
a { color: inherit; }
h1, h2, h3, h4, p { margin-top: 0; }
main { min-height: 100vh; }

.notice-bar {
  display: grid;
  min-height: 34px;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 18px;
  padding: 0 max(20px, calc((100vw - 1420px) / 2));
  color: #dce9e1;
  background: #0b3023;
  font-size: 10px;
  letter-spacing: .03em;
}
.notice-bar div { display: flex; align-items: center; gap: 8px; }
.notice-bar > span { justify-self: end; }
.notice-bar strong { font-size: 10px; letter-spacing: .06em; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: #59c98c; box-shadow: 0 0 0 4px rgba(89, 201, 140, .14); }

.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: grid;
  min-height: 76px;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 28px;
  padding: 0 max(20px, calc((100vw - 1420px) / 2));
  border-bottom: 1px solid var(--line);
  background: rgba(248, 246, 239, .9);
  backdrop-filter: blur(22px) saturate(135%);
}
.brand { display: inline-flex; align-items: center; gap: 11px; text-decoration: none; }
.brand-seal { display: grid; width: 36px; height: 36px; flex: 0 0 auto; place-items: center; border-radius: 10px; color: #fff; background: var(--green); font-family: var(--serif); font-size: 20px; box-shadow: 0 8px 18px rgba(15, 75, 53, .16); }
.brand > span:last-child { display: grid; gap: 2px; }
.brand strong { font-size: 14px; letter-spacing: .02em; }
.brand small { color: var(--muted); font-size: 7px; font-weight: 700; letter-spacing: .12em; }
.desktop-nav { display: flex; justify-content: center; gap: 3px; }
.desktop-nav button { padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #5f6c65; font-size: 12px; cursor: pointer; }
.desktop-nav button:hover { color: var(--green); background: rgba(15, 75, 53, .055); }
.desktop-nav button.active { color: #fff; background: var(--green); font-weight: 720; box-shadow: 0 7px 16px rgba(15, 75, 53, .14); }
.header-action { display: grid; min-height: 38px; padding: 0 14px; place-items: center; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--green); background: rgba(255, 255, 252, .72); font-size: 11px; font-weight: 720; text-decoration: none; }
.header-action:hover { background: #fff; }

.site-frame { width: min(1420px, calc(100% - 40px)); margin: 0 auto; }
.overview { padding: 30px 0 0; }
.hero-panel {
  position: relative;
  display: grid;
  min-height: 515px;
  grid-template-columns: minmax(0, 1.35fr) minmax(310px, .65fr);
  align-items: stretch;
  gap: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.hero-panel::before { position: absolute; inset: 0; pointer-events: none; content: ""; background: radial-gradient(circle at 20% 5%, rgba(41, 114, 78, .1), transparent 30rem), linear-gradient(115deg, transparent 56%, rgba(160, 108, 34, .08)); }
.hero-copy { position: relative; z-index: 1; display: flex; max-width: 840px; flex-direction: column; justify-content: center; padding: clamp(56px, 7vw, 100px); }
.kicker { margin-bottom: 17px; color: var(--green-2); font-size: 10px; font-weight: 850; letter-spacing: .18em; text-transform: uppercase; }
.hero-copy h1 { margin-bottom: 24px; font-family: var(--serif); font-size: clamp(68px, 8.4vw, 118px); font-weight: 700; line-height: .9; letter-spacing: -.075em; }
.hero-copy h1 em { color: var(--green); font-style: normal; }
.hero-copy > p:not(.kicker) { max-width: 650px; margin-bottom: 0; color: #4b5b53; font-size: clamp(15px, 1.6vw, 18px); line-height: 1.85; }
.hero-actions { display: flex; gap: 10px; margin-top: 34px; }
.hero-actions button { padding: 0 18px; border-radius: 11px; cursor: pointer; }
.primary-button { border: 1px solid var(--green); color: #fff; background: var(--green); font-size: 12px; font-weight: 760; }
.primary-button span { margin-left: 10px; }
.secondary-button { border: 1px solid var(--line-strong); color: var(--green); background: transparent; font-size: 12px; font-weight: 720; }
.countdown-card { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: center; padding: 52px; color: #eef6f1; background: linear-gradient(155deg, #153d2e, #08281e); }
.countdown-card::after { position: absolute; right: -90px; bottom: -120px; width: 310px; height: 310px; border: 1px solid rgba(255,255,255,.08); border-radius: 50%; content: ""; box-shadow: 0 0 0 48px rgba(255,255,255,.025), 0 0 0 96px rgba(255,255,255,.018); }
.countdown-label { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-bottom: 36px; }
.countdown-label span { color: #a9c9b8; font-size: 10px; font-weight: 800; letter-spacing: .12em; }
.countdown-label small { color: rgba(239,247,242,.52); font-size: 9px; }
.countdown-card > strong { font-family: var(--serif); font-size: clamp(100px, 11vw, 154px); font-weight: 600; line-height: .78; letter-spacing: -.08em; }
.countdown-card > p { margin: 14px 0 34px; color: #b7d2c3; font-family: var(--serif); font-size: 25px; }
.exam-meta { position: relative; z-index: 1; display: grid; gap: 10px; margin-bottom: 34px; padding: 22px 0; border-block: 1px solid rgba(255,255,255,.12); }
.exam-meta span { display: flex; justify-content: space-between; color: #d9e8df; font-size: 12px; }
.exam-meta span::after { color: rgba(255,255,255,.28); content: "已确认"; font-size: 9px; }
.countdown-card > a { position: relative; z-index: 1; color: #b8d6c6; font-size: 10px; font-weight: 700; text-underline-offset: 4px; }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,252,.65); box-shadow: 0 18px 60px rgba(25,48,38,.05); }
.metric-grid button { position: relative; min-height: 164px; padding: 23px 25px; border: 0; border-left: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.metric-grid button:first-child { border-left: 0; }
.metric-grid button:hover { background: rgba(255,255,255,.75); }
.metric-grid button > span { position: absolute; top: 18px; right: 19px; color: #a5afa9; font-family: var(--serif); font-size: 11px; }
.metric-grid strong { display: block; margin-bottom: 13px; color: var(--green); font-family: var(--serif); font-size: 48px; line-height: 1; letter-spacing: -.05em; }
.metric-grid strong i { margin-left: 5px; color: var(--gold); font-size: .46em; font-style: normal; letter-spacing: -.02em; }
.metric-grid p { margin-bottom: 5px; color: var(--ink); font-size: 13px; font-weight: 760; }
.metric-grid small { color: var(--muted); font-size: 10px; }

.dashboard-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 18px; margin-top: 18px; }
.focus-card { min-height: 360px; padding: 28px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,252,.74); box-shadow: 0 18px 60px rgba(25,48,38,.05); }
.section-cap { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
.section-cap span { color: var(--green); font-size: 10px; font-weight: 850; letter-spacing: .11em; }
.section-cap small { color: var(--muted); font-size: 9px; }
.focus-card > button, .channel-card > button { min-height: 36px; padding: 0; border: 0; color: var(--green); background: transparent; font-size: 10px; font-weight: 780; cursor: pointer; }
.update-card { position: relative; overflow: hidden; background: linear-gradient(145deg, #fffdf7 20%, #f2ebdd); }
.update-number { float: left; margin: 0 24px 10px 0; color: rgba(156,101,27,.2); font-family: var(--serif); font-size: 120px; line-height: .8; letter-spacing: -.08em; }
.update-card h2 { margin-bottom: 15px; font-family: var(--serif); font-size: 28px; line-height: 1.25; letter-spacing: -.03em; }
.update-card > p:not(.update-number) { color: #5d574d; font-size: 13px; line-height: 1.75; }
.workflow-card ol { position: relative; display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.workflow-card li { display: grid; min-height: 48px; grid-template-columns: 42px 1fr; align-items: center; gap: 10px; border-top: 1px solid var(--line); }
.workflow-card li:first-child { border-top: 0; }
.workflow-card b { color: var(--green); font-size: 11px; }
.workflow-card span { color: #526059; font-size: 11px; }
.channel-mini-list { display: grid; }
.channel-mini-list > div { display: grid; min-height: 58px; grid-template-columns: 8px 1fr auto; align-items: center; gap: 11px; border-top: 1px solid var(--line); }
.channel-mini-list > div:first-child { border-top: 0; }
.mini-status { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.mini-status.verified { background: #2d9566; }
.mini-status.pending { background: var(--red); }
.channel-mini-list p { display: grid; gap: 3px; margin: 0; }
.channel-mini-list strong { font-size: 11px; }
.channel-mini-list small { color: var(--muted); font-size: 9px; }
.channel-mini-list em { color: var(--muted); font-size: 9px; font-style: normal; }

.workspace-page { padding: 54px 0 0; }
.daily-audit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,252,.72); box-shadow: 0 14px 40px rgba(25,48,38,.04); }
.daily-audit > div { display: grid; min-height: 106px; align-content: center; gap: 4px; padding: 17px 20px; border-left: 1px solid var(--line); }
.daily-audit > div:first-child { border-left: 0; }
.daily-audit span { color: var(--muted); font-size: 8px; font-weight: 760; letter-spacing: .05em; }
.daily-audit strong { color: var(--green); font-family: var(--serif); font-size: 29px; line-height: 1; }
.daily-audit small { color: #68736d; font-size: 8px; }
.daily-audit > p { grid-column: 1 / -1; margin: 0; padding: 13px 20px; border-top: 1px solid var(--line); color: #5f6c65; background: var(--green-3); font-size: 9px; line-height: 1.7; }
.page-title-row { display: grid; min-height: 220px; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 40px; padding: 24px clamp(4px, 2vw, 28px) 36px; }
.page-title-row > div:first-child { max-width: 910px; }
.page-title-row h1 { margin-bottom: 15px; font-family: var(--serif); font-size: clamp(48px, 6vw, 78px); line-height: 1; letter-spacing: -.06em; }
.page-title-row > div:first-child > p:last-child { max-width: 780px; margin-bottom: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.title-stat { min-width: 138px; padding: 20px 0 3px; border-top: 2px solid var(--green); text-align: right; }
.title-stat strong { display: block; font-family: var(--serif); font-size: 43px; line-height: 1; }
.title-stat span { color: var(--muted); font-size: 10px; }

.workspace-toolbar { position: sticky; top: 76px; z-index: 12; display: flex; align-items: end; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 18px 18px 0 0; background: rgba(255,254,249,.94); box-shadow: 0 10px 30px rgba(21,43,34,.05); backdrop-filter: blur(18px); }
.search-box { display: flex; min-height: 46px; flex: 1; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid transparent; border-radius: 11px; background: #eeeee8; color: var(--muted); }
.search-box:focus-within { border-color: var(--line-strong); background: #fff; }
.search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
.workspace-toolbar > label:not(.search-box) { display: grid; min-width: 180px; gap: 5px; color: var(--muted); font-size: 9px; }
.workspace-toolbar select { min-height: 46px; padding: 0 34px 0 12px; border: 1px solid var(--line); border-radius: 11px; outline: 0; background: #fff; color: var(--ink); font-size: 11px; }

.study-workspace { display: grid; grid-template-columns: 205px 340px minmax(0, 1fr); align-items: start; overflow: clip; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 22px 22px; background: rgba(255,255,252,.74); box-shadow: var(--shadow); }
.workspace-rail { position: sticky; top: 151px; min-height: calc(100vh - 166px); padding: 23px 18px; border-right: 1px solid var(--line); background: rgba(238,236,227,.55); }
.rail-block { padding: 19px 0; border-top: 1px solid var(--line); }
.rail-block:first-child { padding-top: 0; border-top: 0; }
.rail-block > span { display: block; margin-bottom: 10px; color: var(--green-2); font-size: 9px; font-weight: 850; letter-spacing: .1em; }
.rail-block strong { display: block; margin-bottom: 8px; font-size: 12px; }
.rail-block p, .rail-block li { color: #5c6962; font-size: 10px; line-height: 1.65; }
.rail-block ul, .rail-block ol { display: grid; gap: 7px; margin: 0; padding-left: 17px; }
.workspace-rail > button { width: 100%; margin-top: 12px; border: 1px solid var(--line); border-radius: 9px; color: var(--green); background: rgba(255,255,255,.68); font-size: 10px; cursor: pointer; }

.record-index { max-height: calc(100vh - 151px); overflow: auto; border-right: 1px solid var(--line); background: var(--surface-2); scrollbar-width: thin; }
.index-head { position: sticky; top: 0; z-index: 2; display: flex; min-height: 52px; align-items: center; justify-content: space-between; gap: 16px; padding: 0 17px; border-bottom: 1px solid var(--line); background: rgba(248,247,241,.95); backdrop-filter: blur(12px); }
.index-head strong { font-size: 11px; }
.index-head span { color: var(--muted); font-size: 9px; }
.record-index > button { position: relative; display: grid; width: 100%; min-height: 138px; grid-template-columns: 30px 1fr; gap: 10px; padding: 18px 17px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.record-index > button:hover { background: rgba(255,255,255,.72); }
.record-index > button.active { background: #fff; box-shadow: inset 3px 0 var(--green); }
.index-number { padding-top: 2px; color: #98a39d; font-family: var(--serif); font-size: 11px; }
.record-index > button.active .index-number { color: var(--green); font-weight: 800; }
.index-copy { display: grid; align-content: start; gap: 7px; min-width: 0; }
.index-copy small { color: var(--green-2); font-size: 8px; font-weight: 760; letter-spacing: .04em; }
.index-copy strong { display: -webkit-box; overflow: hidden; font-family: var(--serif); font-size: 15px; line-height: 1.35; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.index-copy em { overflow: hidden; color: var(--muted); font-size: 9px; font-style: normal; text-overflow: ellipsis; white-space: nowrap; }
.index-copy i { width: fit-content; padding: 3px 6px; border-radius: 5px; color: var(--gold); background: var(--gold-soft); font-size: 8px; font-style: normal; font-weight: 720; }
.empty { padding: 50px 20px; color: var(--muted); text-align: center; }
.empty strong { color: var(--ink); }
.empty p { margin-top: 7px; font-size: 11px; }

.reader { min-width: 0; padding: 36px clamp(25px, 4vw, 60px) 64px; overflow-wrap: anywhere; }
.reader-header { padding-bottom: 32px; border-bottom: 1px solid var(--line); }
.record-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
.record-badges span { padding: 5px 8px; border-radius: 6px; color: #5a665f; background: #ecece6; font-size: 8px; font-weight: 760; }
.record-badges span.verified { color: var(--green); background: var(--green-3); }
.record-badges span.pending { color: var(--red); background: var(--red-soft); }
.reader-header > p { margin-bottom: 10px; color: var(--green-2); font-size: 9px; font-weight: 760; letter-spacing: .04em; }
.reader-header h2 { max-width: 820px; margin-bottom: 20px; font-family: var(--serif); font-size: clamp(28px, 3vw, 42px); line-height: 1.25; letter-spacing: -.035em; }
.source-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.source-actions a { display: grid; min-height: 34px; padding: 0 11px; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--green); background: rgba(255,255,255,.7); font-size: 9px; font-weight: 740; text-decoration: none; }
.reader-section { padding: 29px 0; border-bottom: 1px solid var(--line); }
.reader-section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 17px; }
.reader-section-title > span { display: grid; width: 28px; height: 28px; flex: 0 0 auto; place-items: center; border-radius: 8px; color: #fff; background: var(--green); font-family: var(--serif); font-size: 10px; }
.reader-section-title h3 { margin: 0; font-size: 12px; }
.reader-section-title small { margin-left: auto; color: var(--muted); font-size: 8px; }
.reader-section-title button { min-height: 32px; margin-left: auto; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--green); background: #fff; font-size: 9px; cursor: pointer; }
.long-copy { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.95; white-space: pre-line; }
.question-list { display: grid; gap: 10px; margin: 0; padding-left: 24px; color: #34433c; font-size: 12px; line-height: 1.7; }
.question-list li { padding-left: 4px; }
.answer-disclosure { margin-top: 28px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.52); overflow: hidden; }
.answer-disclosure summary { display: flex; min-height: 54px; align-items: center; justify-content: space-between; gap: 20px; padding: 0 17px; color: var(--green); font-size: 11px; font-weight: 760; cursor: pointer; list-style: none; }
.answer-disclosure summary::-webkit-details-marker { display: none; }
.answer-disclosure summary b { margin-right: 9px; color: var(--gold); font-family: var(--serif); }
.answer-disclosure summary em { color: var(--muted); font-size: 8px; font-style: normal; font-weight: 500; }
.answer-body { padding: 0 22px 26px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 12px; line-height: 1.85; }
.answer-body h4 { margin: 27px 0 8px; color: var(--ink); font-size: 11px; }
.answer-body p { margin-bottom: 0; }
.answer-body ol { margin: 10px 0 0; padding-left: 21px; }
.answer-body li { margin-bottom: 8px; }
.published-note { margin-top: 22px; padding: 17px 18px; border-radius: 10px; background: var(--gold-soft); color: #5e4a2e; font-size: 11px; line-height: 1.7; }
.published-note strong { color: #795116; font-size: 9px; }
.published-note p { margin: 6px 0 3px; }
.published-note small { color: #8a775c; font-size: 8px; }
.answer-summary { margin-top: 22px; padding: 17px; border-radius: 10px; background: var(--green-3); }
.answer-summary strong { color: var(--green); font-size: 9px; }
.answer-summary ul { margin: 8px 0 0; padding-left: 18px; }

为法律法规授权还是行政委托？","奥康公司提起行政诉讼时应以谁为被告？"],"sourceAnswer":"协会没有法律、法规或规章授权时，所谓“授权”按行政委托处理，法律责任由委托机关承担，被告是市场监管局。","organizedAnswer":["授权来源必须是法律、法规或规章，行政机关自己的文件不能创设行政授权。","无规范授权时，协会属于受委托组织，以委托机关名义实施行为。","诉讼中由委托的市场监管局作为被告。"],"pitfall":"仅凭文件使用“授权”二字就把协会列为被告。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5333536262327506.html","answerUrl":"https://www.sina.cn/news/detail/5333702357290950.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-03","date":"2026-08-20","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"土地使用权收回、行为定性","title":"第 3 题｜收回国有土地使用权的行为性质","questionSummary":"政府因公共利益或因土地长期未开发而收回国有土地使用权，两种情形应如何分别定性？","questionText":"请分别判断下列两个相互独立的行政行为性质，并说明理由：\n\n1. 因公共利益需要，某市政府依照法定程序提前收回已经出让给甲公司的土地使用权。\n2. 甲公司未按国有土地出让合同约定的期限和条件开发利用土地，市自然资源主管部门据此无偿收回已经出让的国有土地使用权。","trainingQuestions":["因公共利益提前收回土地使用权应如何定性？","因用地人违反开发义务而无偿收回应如何定性？","两项行为在目的、惩戒性和补偿规则上有何区别？"],"sourceAnswer":"因公共利益依法收回，核心是行政征收并涉及补偿；因违反开发义务收回，应结合规范目的和是否具有惩戒性判断，不宜机械统一归类。","organizedAnswer":["先找收回依据和直接目的。","公共利益收回属于对既有财产权的征收，应依法补偿。","闲置或未开发收回要审查是否以违法为前提、是否具有制裁性，并据此判断处罚或其他行政处理。"],"pitfall":"只看结果都是“收回”，忽略行为目的与法律依据。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5333898650190437.html","answerUrl":"https://www.sina.cn/news/detail/5334064744895160.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-04","date":"2026-08-21","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"行政强制措施、被告、管辖","title":"第 4 题｜依据内部指令扣押冰柜的被告与管辖","questionSummary":"城管执法人员依据上级内部指令扣押经营者冰柜，经营者起诉扣押行为，应如何确定被告和管辖法院？","questionText":"某市城市管理局执法人员认定陈莉擅自占用道路经营冷饮并影响市容，以该局内设的“综合整治指挥部”名义扣押陈莉经营使用的冰柜等物品，扣押决定加盖指挥部印章。陈莉不服并提起行政诉讼。\n\n请回答：\n1. 本案被告应如何确定？\n2. 本案一审应由基层法院还是中级法院管辖？","trainingQuestions":["内设机构以自己名义作出扣押决定时谁是适格被告？","内设机构是否具有独立承担行政责任的能力？","本案一审级别管辖应如何确定？"],"sourceAnswer":"对外作出扣押并署名的城管机关承担责任；内部指令通常不直接改变被告。地域管辖围绕作出强制措施机关所在地及不动产专属管辖是否适用判断。","organizedAnswer":["锁定对外实施扣押的行政机关，内部请示或指令不是当然的外部行政行为。","扣押属于行政强制措施，应审查权限、批准、清单、保管和期限。","按行政诉讼一般地域管辖判断；冰柜是动产，不适用不动产案件专属管辖。"],"pitfall":"把作出内部指令的上级机关直接列为被告。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5334261038321871.html","answerUrl":"https://www.sina.cn/news/detail/5334427133019801.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-05","date":"2026-08-22","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"政府信息公开、机构名义","title":"第 5 题｜区政府信息公开办公室能否独立当被告","questionSummary":"区政府政务公开办公室以自己名义答复信息不存在；申请人在庭审中又要求公开另一份材料。应如何确定被告、复议前置及新增诉请的处理？","questionText":"2025 年 6 月 16 日，王某邮寄申请区政府公开某棚户区改造项目的地上物现状调查册，区政府次日收到申请。6 月 30 日，区政府指定的政务公开办公室以自己名义作出答复，告知申请信息不存在，并加盖该办公室印章。王某不服，提起行政诉讼，请求判令公开该调查册；庭审中又提出要求公开土地价格评估报告。\n\n请回答：\n1. 针对已经作出的答复，谁是本案被告？\n2. 若收到申请后逾期未答复，谁是被告？\n3. “信息不存在”答复是否必须先复议再起诉？\n4. 王某在庭审中新增公开另一份材料的请求，法院应如何处理？","trainingQuestions":["指定的信息公开工作机构以自己名义答复时谁是被告？","逾期不答复时谁是被告？","信息不存在答复是否属于复议前置范围？","庭审中新增诉讼请求，法院是否准许？"],"sourceAnswer":"已经答复的，以自己名义作出答复的政务公开办公室为被告；逾期不答复的，以收到申请的区政府为被告。“信息不存在”不属于法定的四类信息公开复议前置事项，可直接起诉。庭审中无正当理由新增另一项公开请求，法院不予准许。","organizedAnswer":["政府信息公开司法解释对指定工作机构设置特别被告规则：该机构以自己名义作出答复时，可独立作为被告。","行政机关逾期未答复的，以收到申请的行政机关即区政府为被告。","复议前置限于国家秘密及安全稳定、商业秘密和个人隐私、内部事务、过程性信息及行政执法案卷等不予公开决定；信息不存在不在其中。","起诉状副本送达被告后，原告新增诉讼请求原则上不予准许，但有正当理由的除外。"],"pitfall":"只看落款，不判断组织法地位。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5334623426445879.html","answerUrl":"https://www.sina.cn/news/detail/5334789520885344.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-06","date":"2026-08-23","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"未成年人、行政处罚、强制措施","title":"第 6 题｜17 岁观众冲入演出区域的行政处理","questionSummary":"17 岁观众在演出现场冲入管控区域，公安机关采取控制措施并拟处罚。应如何判断强制措施、处罚责任及程序？","questionText":"2025 年 4 月，17 岁的任某在甲市乙县体育馆举行的大型商业演唱会中强行翻越内场护栏并冲上舞台，造成演出中断约十分钟、现场秩序严重混乱。乙县公安局民警先将任某强行带离，调查后又作出处理决定：行政拘留 10 日并处罚款 500 元，同时要求任某未来 12 个月不得进入任何体育场馆观看同类商业演出。任某不服并起诉。\n\n请回答：\n1. 强行带离现场的行为是什么性质？\n2. 12 个月禁入体育场馆的行为是什么性质？\n3. 上述两项行为是否可诉？\n4. 行政拘留与禁入措施并用是否违反一事不再罚？\n5. 公安机关作出该处理决定应适用何种行政处罚程序？","trainingQuestions":["强行带离与后续处罚应如何分别定性？","长期禁入体育场馆是否属于独立行政处罚或其他行政行为？","两项行为是否具有可诉性？","拘留与禁入并用是否违反一事不再罚？","对未成年人作出处罚应适用何种程序并保障哪些权利？"],"sourceAnswer":"现场控制措施与后续处罚须分开评价。17 周岁属于可承担行政处罚责任的年龄段，但依法应从轻或减轻，并保障监护人通知等程序。","organizedAnswer":["先区分即时制止、传唤等强制措施和最终行政处罚。","年龄影响责任与裁量：已满十四周岁不满十八周岁，应依法从轻或减轻处罚。","审查身份告知、听取陈述申辩、监护人通知及记录等程序。"],"pitfall":"认为未满十八周岁一律不处罚。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5334985813788282.html","answerUrl":"https://www.sina.cn/news/detail/5335151909013478.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-07","date":"2026-08-24","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"经批准行为、被告资格","title":"第 7 题｜下级报批、上级批准后由谁作被告","questionSummary":"金融监管派出机构拟定处理意见并报上级批准，最终决定以某机关名义对外送达。被诉时如何确定被告？","questionText":"甲市乙县奥康商业银行因违规关联交易、资本充足率严重不足而违反审慎经营规则。国家金融监督管理总局甲市监管分局调查后，经上级批准，以监管分局名义作出处理决定，要求银行暂停部分高风险资产业务并限制分配红利；银行在后续救济中还涉及以过程性信息为由不予公开的政府信息答复。\n\n请回答：\n1. 处理决定经上级批准但以监管分局名义对外作出，应以谁为行政诉讼被告？\n2. 暂停高风险资产业务、限制分配红利属于行政处罚还是行政强制措施？\n3. 银行对该处理决定不服，是否属于行政诉讼受案范围？\n4. 对以过程性信息为由不予公开的答复，能否不经复议直接起诉？","trainingQuestions":["经上级批准的行政行为如何依据对外文书署名确定被告？","审慎监管措施应认定为行政处罚还是行政强制措施？","该处理决定是否可诉？","过程性信息不予公开是否适用复议前置？"],"sourceAnswer":"经批准案件不能只看内部审批链条，应依行政诉讼规则和最终对外署名确定责任机关；公开答案强调以对外作出决定的机关为中心判断。","organizedAnswer":["区分内部批准与对外行政决定。","核对决定书署名、印章和法定权限，确定谁对外形成法律效果。","在被告正确后，再审查事实、法律适用与报批程序是否合法。"],"pitfall":"把所有内部参与机关都列为共同被告。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5335348201916149.html","answerUrl":"https://www.sina.cn/news/detail/5335514296095124.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-08","date":"2026-08-25","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"行政许可、撤回撤销、法不溯及既往","title":"第 8 题｜无期限演出许可遇到新规","questionSummary":"经营者取得未载明期限的演出许可，后来新规改变许可条件，行政机关拟取消许可。行为性质和时间效力如何判断？","questionText":"2009 年 8 月 19 日，甲省乙县文旅局向红旗文工团颁发未注明有效期限的营业性演出许可证。8 月 28 日，新公布的部门规章规定此类许可证有效期为两年，并于同年 10 月 1 日施行。2013 年 5 月，县文旅局直接适用新规认定许可证到期，在未告知文工团、未听取陈述申辩的情况下作出注销决定；注销公告刊登于当地报纸，但没有直接送达文工团。文工团后来得知后提起诉讼。\n\n请回答：\n1. 注销行为是否属于行政处罚？\n2. 注销行为是否属于行政诉讼受案范围？\n3. 法院应当作出何种判决？","trainingQuestions":["许可证注销是否具有行政处罚的惩戒性？","注销许可是否属于可诉行政行为？","未告知、未听取陈述申辩且未送达对裁判结果有何影响？"],"sourceAnswer":"取消许可不因产生不利后果就当然属于行政处罚；需在撤回、撤销、注销等制度中依原因定性，并遵守新法不溯及既往和信赖保护。","organizedAnswer":["以取消原因定性：违法取得可能撤销，公共利益或依据变化可能撤回，法定终止情形才是注销。","行政处罚要求惩戒性，单纯终止许可通常不是处罚。","新规原则上规范生效后的事项，对既有许可应考虑信赖保护与补偿。"],"pitfall":"把所有“取消许可证”都写成吊销许可证的行政处罚。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5335710590043877.html","answerUrl":"https://www.sina.cn/news/detail/5335876684746019.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-09","date":"2026-08-26","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"机构职权变更、被告变更、裁判方式","title":"第 9 题｜预售许可争议中机构职权调整","questionSummary":"当事人起诉商品房预售许可机关后，相关职权发生调整；法院告知变更被告而原告拒绝。法院如何处理？","questionText":"2017 年 1 月，县建设局向华源小区开发商甲颁发商品房预售许可证，许可销售一定面积的地下车位。小区业主林某在开发商开始销售车位时得知许可，认为相关车位和人防工程依法应当服务全体业主，建设局无权许可开发商出售，遂提起行政诉讼。其间，房产预售、登记职权已经由县建设局调整至县国土资源局。法院告知林某变更被告，林某拒绝；开发商甲作为第三人参加诉讼。\n\n请回答：\n1. 林某拒绝变更被告后，法院应当如何处理？\n2. 林某作为小区业主是否具有原告资格？\n3. 若行政机关未举证或逾期举证，第三人开发商甲能否提供证明预售许可合法的证据？","trainingQuestions":["行政职权变更后谁承受被告资格，原告拒绝变更时法院如何裁定？","小区业主与车位预售许可是否具有法律上的利害关系？","被告怠于举证时第三人能否提交证据？"],"sourceAnswer":"行政职权变更后由继续行使该职权的机关承受诉讼责任；经释明原告拒绝变更错误被告的，可裁定驳回起诉。","organizedAnswer":["先查职权调整文件，确定现由哪个机关继续行使涉案职权。","法院应释明并给予原告变更被告的机会。","原告无正当理由拒绝变更，起诉不符法定条件，裁定驳回。"],"pitfall":"直接判决驳回诉讼请求，混淆实体裁判和起诉条件。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5336072978171749.html","answerUrl":"https://www.sina.cn/news/detail/5336239072611479.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-10","date":"2026-08-27","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"行政许可撤销、资格限制","title":"第 10 题｜骗领驾驶证被撤销并三年禁申","questionSummary":"申请人以欺骗手段取得驾驶证，行政机关撤销许可并告知三年内不得再次申请。两项后果的性质如何判断？","questionText":"崔某以作弊方式取得驾驶证。某市交警大队发现后撤销其驾驶证，并禁止崔某三年内参加驾考、再次申请驾驶证。崔某申请行政复议；市政府经审理认为其复议请求不成立，驳回复议请求。崔某不服并提起行政诉讼。\n\n请回答：\n1. 撤销驾驶证是否属于行政处罚？\n2. 三年内禁止参加驾考、申请驾驶证是什么性质？\n3. 本案行政诉讼被告应如何确定？","trainingQuestions":["因作弊取得许可而撤销是否具有行政处罚的惩戒性？","三年禁申是否属于行为罚？","复议机关驳回复议请求是否构成复议维持，谁是共同被告？"],"sourceAnswer":"因欺骗取得许可而撤销，是许可纠错机制，并非当然属于行政处罚；三年禁申是法律规定的资格限制后果，应分别审查依据。","organizedAnswer":["撤销针对原许可取得违法，功能是纠正违法授益行为。","是否构成处罚取决于规范定性与惩戒性，不能只看不利后果。","三年禁申须有明确法律依据，并审查告知、听取意见等程序。"],"pitfall":"把撤销许可与吊销许可证混为同一种处罚。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5336435365252898.html","answerUrl":"https://www.sina.cn/news/detail/5336601460477169.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-11","date":"2026-08-28","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"原告资格、债权人与行政处罚","title":"第 11 题｜债权人能否起诉对茶企的处罚","questionSummary":"市场监管局因代用茶配料重复标注处罚销售商；生产商起诉，销售商作为第三人。题目综合考查原告资格、听证、法律适用、免责、上诉与遗漏第三人。","questionText":"区市场监管局检查发现泰和堂公司销售云雾山公司生产的代用茶，产品配料栏同时标注“山梨酸钾”和“保鲜剂（山梨酸钾）”。监管局认定构成重复标注，没收违法所得 711.5 元并罚款 29,288.5 元。生产商云雾山公司不服并起诉，法院通知销售商泰和堂公司作为第三人。当地规定对法人处以 2 万元以上罚款应告知听证权；食品安全法对不影响安全且不误导消费者的标签瑕疵，以及已经履行进货查验义务的经营者分别设有处理规则。\n\n请回答：\n1. 云雾山公司是否具有原告资格？\n2. 监管局未经听证程序即作出处罚是否合法？\n3. 将重复标注按一般违法处以 2.9 万元罚款，是否存在实体违法？\n4. 泰和堂能够证明已经履行进货查验义务且不知道标签问题时，能否免予处罚？\n5. 一审法院将罚款变更为 2,000 元，原被告均不上诉，第三人泰和堂能否独立上诉？\n6. 一审遗漏应当参加诉讼的第三人，二审法院如何处理？","trainingQuestions":["生产商与对销售商的处罚是否具有法律上的利害关系？","较大数额罚款是否应告知听证权？","重复标注属于一般标签违法还是不误导消费者的标签瑕疵？","履行进货查验义务的经营者能否免罚？","行政诉讼第三人能否独立上诉？","一审遗漏第三人时二审如何处理？"],"sourceAnswer":"生产商可依利害关系取得原告资格。法人罚款超过当地听证标准而未告知听证权，程序违法。重复标注若不影响食品安全且不误导消费者，应适用标签瑕疵条款，原罚款存在适用法律错误。经营者已尽进货查验义务并如实说明来源的，可以免罚。行政诉讼第三人具有独立诉讼地位，可以上诉；一审遗漏第三人的，二审应撤销原判并发回重审。","organizedAnswer":["云雾山公司是涉案商品生产商，处罚对产品违法定性直接影响其权益，且难以通过与销售商之间的民事诉讼消除该行政定性，可论证具有原告资格。","2.9 万元超过当地法人较大数额罚款门槛，处罚前应告知听证权；仅书面调查即作出处罚构成程序违法。","配料重复标注若不影响安全且不会误导消费者，属于标签瑕疵，应先责令改正，拒不改正时才在法定较低幅度内处罚。","泰和堂已履行进货查验、确不知情并能说明来源时，符合食品安全法免罚条件。","第三人属于行政诉讼当事人，可独立上诉；遗漏当事人属于严重程序问题，二审撤销并发回重审。"],"pitfall":"把生产商误写成一般债权人；遗漏听证数额标准、标签瑕疵特别规则和第三人的独立诉讼地位。","answerState":"已核验·有分歧","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5336797753117125.html","answerUrl":"https://www.sina.cn/news/detail/5336963848079608.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-12","date":"2026-08-29","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"行政处罚调查、询问笔录","title":"第 12 题｜酒后无证驾驶的调查与询问程序","questionSummary":"公安机关处理酒后偷开机动车案件，综合考查询问程序、异地询问、治安案件期限、规范性文件附带审查与裁量基准适用。","questionText":"2026 年 2 月 7 日，董某酒后偷开邻居冯某的奥迪汽车上路。甲市公安局乙区分局接警后传唤董某，并询问证人王某和被侵害人。2 月 10 日，区公安分局依据治安管理处罚法和本局裁量基准，对董某处行政拘留 10 日并罚款 1,000 元。董某于 2 月 15 日申请行政复议，并请求附带审查区公安分局制定的行政处罚裁量基准。\n\n请回答：\n1. 公安机关询问王某应遵守哪些要求？\n2. 冯某不在甲市时，可以通过哪些方式询问？\n3. 治安案件法定办案期限如何计算和延长？\n4. 复议机关如何处理对裁量基准的附带审查请求？\n5. 题设处罚是否符合该裁量基准？","trainingQuestions":["询问证人时出示证件、笔录核对与书面陈述有哪些要求？","异地证人可采用哪些现场、委托或远程询问方式？","治安案件办案期限、延长次数及不计入期限事项是什么？","复议机关对有权处理的规范性文件附带审查如何作出处理？","如何把裁量基准中的严重情形与本案事实进行涵摄？"],"sourceAnswer":"询问人员应出示人民警察证，笔录交被询问人核对或宣读并签名确认，书面材料请求原则上准许。异地询问可以在所在地进行、委托当地公安机关或远程视频进行。治安案件原则上自立案起 30 日，重大复杂案件经批准可延长 30 日，延长以两次为限，鉴定与听证期间不计入。复议机关有权处理裁量基准的，应在 30 日内审查并依合法与否分别告知或责令纠正。本案酒后偷开机动车符合严重情形，拘留 10 日并罚款 1,000 元在基准幅度内。","organizedAnswer":["询问人员出示警察证；笔录交被询问人核对，无阅读能力的予以宣读；允许补充更正，确认无误后由被询问人及询问人员签名，并可提交书面材料。","可到证人单位、住处或其提出的地点询问，也可通知其到公安机关；还可委托所在地公安机关，或通过公安视频系统远程询问并同步录音录像。","办案期限原则上 30 日，重大复杂经上一级公安机关批准延长 30 日，延长以两次为限；鉴定和听证期间不计入。","乙区政府作为复议机关对区公安分局制定的裁量基准有权处理，应在 30 日内审查；合法的在复议决定中告知，违法的停止执行并责令纠正。","将酒后偷开机动车事实对应基准中的严重情形，10 日拘留和 1,000 元罚款均在规定幅度内。"],"pitfall":"只写酒驾实体责任，遗漏题目要求的调查程序。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5337160141767580.html","answerUrl":"https://www.sina.cn/news/detail/5337326235422390.html","verifiedAt":"2026-08-31"},{"id":"2026-lijia-13","date":"2026-08-30","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"环境行政执法、原告资格、损害救济","title":"第 13 题｜诊所排放导致鱼类死亡的多重责任","questionSummary":"卫健局查处医美诊所违法排放，题目考查证据先行登记保存、审判延期、第三人退庭与自然人死亡后的诉讼处理。","questionText":"任某在乙县经营医美诊所，长期把未经处理的医疗废水和带血棉签等医疗废物倾倒至公共排水渠，造成相邻小区景观池恶臭、景观鱼大量死亡。县卫健局接到居民陆某举报后现场检查，对排水渠残留物和诊所监控硬盘采取证据先行登记保存；七日后检测确认污染严重，遂以违反医疗废物管理规定为由对任某罚款 2 万元。任某起诉，法院通知陆某作为第三人参加诉讼。\n\n请回答：\n1. 采取证据先行登记保存的法定条件和程序是什么？\n2. 庭审中法院认为需要通知新的证人到庭，应如何处理？\n3. 第三人陆某未经法庭许可中途退庭，法院应如何处理？\n4. 诉讼中任某突发心脏病死亡，法院应如何处理？","trainingQuestions":["先行登记保存须满足何种证据风险、审批和七日处理要求？","需要通知新证人到庭时应延期审理还是中止诉讼？","第三人未经许可中途退庭应按撤诉、缺席审理还是其他方式处理？","原告死亡后案件应先中止还是终结，取决于哪些继承与诉讼承受事实？"],"sourceAnswer":"截至 2026-08-31，本库已定位并保存完整题目单篇页；当天公布答案的单篇公开镜像尚未形成稳定索引，因此本条只提供完整原创作答，不把推演标成教师公布答案。","organizedAnswer":["证据可能灭失或以后难以取得时，经行政机关负责人批准可以先行登记保存，并应在七日内及时作出处理决定；保存期间不得销毁或转移证据。","庭审中需要通知新证人到庭的，法院应当延期审理，而非中止诉讼。","第三人未经法庭许可中途退庭，不影响案件审理的，可以缺席审理；不能把第三人直接按原告撤诉处理。","原告死亡后，如案件所涉权利义务可由近亲属承受，应先中止诉讼并等待有权主体表明是否参加；无人承受或依法不需继续审理时，再终结诉讼。"],"pitfall":"把延期审理与中止诉讼混淆；把第三人退庭机械写成按撤诉；原告死亡后不审查诉讼承受就直接终结。","answerState":"答案待公开复核","confidence":"题面已核验·答案待核验","sourceUrl":"https://www.sina.cn/news/detail/5337522529634735.html","verifiedAt":"2026-08-31"},{"id":"2026-meng-225","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"合同相对性、以房抵款","title":"案例带学第 225 题｜工程款与以房抵款安排","questionSummary":"建设工程合作中约定以房屋折抵应付款，一方因第三方原因未能按约履行，能否据此免除违约责任？","sourceAnswer":"合同责任具有相对性；第三人的原因原则上不免除合同债务人的违约责任，债务人承担后可另行向第三人追偿。","organizedAnswer":["先确定双方之间合同义务的内容和履行期限。","第三人原因属于债务人与第三人内部风险，除法定或约定免责外，不对抗合同相对人。","结论上由债务人承担继续履行、赔偿等责任，再处理内部追偿。"],"pitfall":"把第三人违约直接当作不可抗力。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-226","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"预约合同、定金返还","title":"案例带学第 226 题｜购房预约与定金","questionSummary":"双方签订购房预约并交付定金，后因不可归责于双方的原因未能订立本约，定金如何处理？","sourceAnswer":"因不可归责于双方的事由导致本约未订立，定金罚则不适用，收受方应返还定金。","organizedAnswer":["先区分预约合同和商品房买卖本约。","判断未订立本约的原因是否可归责；双方诚信磋商仍因外部原因失败的，不适用定金罚则。","返还定金不等于双倍返还，除非收受方存在导致目的不能实现的违约。"],"pitfall":"只要没有签成本约就机械双倍返还。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-227","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"商品房广告、要约","title":"案例带学第 227 题｜销售宣传能否进入合同","questionSummary":"开发商通过宣传资料、沙盘等对规划和配套作具体说明，买受人据此签约。宣传内容是否构成合同内容？","sourceAnswer":"对开发规划范围内房屋及相关设施作具体确定说明，并对订约和价格有重大影响的，构成要约；即使未写入合同，也可视为合同内容。","organizedAnswer":["审查宣传是否具体、确定，而非一般夸张宣传。","判断其是否对订立合同及价格形成重大影响。","满足条件时按合同内容处理，违反可主张违约责任。"],"pitfall":"所有广告都认定为要约，或所有广告都认定为要约邀请。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-228","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"违约金调整","title":"案例带学第 228 题｜日百分之五违约金能否调整","questionSummary":"商品房合同约定迟延履行按日百分之五承担违约金，违约方请求法院调低，法院如何审查？","sourceAnswer":"约定违约金明显高于实际损失时，可依请求适当减少；日百分之五通常已明显过高，但仍应结合损失、履行程度、过错和预期利益综合判断。","organizedAnswer":["违约金兼具补偿和督促履行功能，不以约定即绝对不变。","当事人提出调整请求后，以实际损失为基础，综合合同履行、过错和预期利益。","本案比例显著异常，法院可以适当调低，但不是当然降到固定标准。"],"pitfall":"直接写成法定上限为损失的百分之三十。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-229","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"可预见规则、期待利益","title":"案例带学第 229 题｜工程合作中的预期利益损失","questionSummary":"建设合作一方违约，另一方主张未来转售房屋可获利润。该期待利益是否全部赔偿？","sourceAnswer":"违约损害赔偿包括可得利益，但不得超过违约方订约时预见或应当预见的损失；高度不确定或缺少证明的未来利润不当然支持。","organizedAnswer":["先证明违约、损失和因果关系。","期待利益还要通过可预见性、确定性和减损规则筛选。","结合交易基础、市场价格与履行概率计算，不能以单方估算替代证据。"],"pitfall":"把所有预计利润都列为可得利益。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-230","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"商品房宣传、违约损害","title":"案例带学第 230 题｜沙盘与宣传资料的责任","questionSummary":"购房人信赖销售宣传和沙盘展示订立合同，交房后发现配套、位置或规划不符，如何确定宣传的合同效力和损害？","sourceAnswer":"公开索引能确认题目与配图答案存在，但答案图片文字尚未完成稳定核验；可与第 227 题的商品房广告规则联动理解。","organizedAnswer":["先按具体确定性和重大影响判断宣传是否构成合同内容。","构成合同内容而实际交付不符的，适用违约责任；不构成时仍可审查缔约过失或欺诈。","赔偿范围应与承诺差异造成的价值减损、替代成本等相联系。"],"pitfall":"将本库整理推演误当作教师图片原答案。","answerState":"题面已核验·答案图片待复核","confidence":"题面已核验·答案待核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-231","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"房屋租赁、登记备案、实际履行","title":"案例带学第 231 题｜二十五年租期与未登记","questionSummary":"房屋租赁约定二十五年且未办理登记备案，合同效力和继续履行请求应如何处理？","sourceAnswer":"租赁登记备案不是合同生效要件；超过二十年的部分无效。即使合同有效，非金钱债务存在法律上或事实上不能履行、标的不适于强制履行等情形时，可不支持继续履行。","organizedAnswer":["未登记备案原则上不影响租赁合同效力。","租赁期限不得超过二十年，超过部分无效。","继续履行是违约救济之一，但需排除不能履行、费用过高或不适宜强制履行等例外。"],"pitfall":"把未备案直接写成合同无效。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"},{"id":"2026-meng-232","date":"2026-08","institution":"方圆众合","teacher":"孟献贵","platform":"微博公开页（新浪镜像）","subject":"民法","topic":"技术开发合同、情势变更","title":"案例带学第 232 题｜技术委托开发遇政策变化","questionSummary":"委托研发锅炉脱硫技术，合同订立后政策发生重大变化，继续履行显失公平。合同性质和情势变更如何判断？","sourceAnswer":"技术委托开发合同属于诺成合同；政策变化若订约时不可预见、不属于商业风险，且继续履行明显不公平，可先协商，协商不成请求变更或解除。","organizedAnswer":["合同自意思表示一致时成立，不以成果交付为成立要件。","情势变更要求基础条件发生订约时无法预见、非商业风险的重大变化。","当事人先重新协商；合理期限内协商不成，法院或仲裁机构可变更或解除。"],"pitfall":"把一般成本上涨都认定为情势变更。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/media/2342740757","verifiedAt":"2026-08-31"}],"historicalPapers":[{"year":2016,"examName":"2016 年国家司法考试试卷四","confidence":"官方公布","sourceUrl":"https://edu.people.com.cn/n1/2016/0926/c1053-28739783.html","answerUrl":"https://www.eol.cn/hang_kao/si_fa/shi_fa_zn/news/201609/t20160921_1451029_7.shtml","note":"官方题目经权威媒体转发；本库仅作结构化摘要，原页面注明未经许可不得转载。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"法律面前人人平等、严格司法","prompt":"结合材料论述法律面前人人平等及严格司法对公平正义的保障。","answer":"围绕平等适用法律、司法权依法独立公正行使、以事实为根据以法律为准绳、程序公正与裁判公信展开。"},{"no":"二","subject":"刑法","topic":"错误认识、因果关系、犯罪形态","prompt":"围绕扣押画作、行为人误以为被害人死亡而掩埋、后续救助等连续事实分析刑事责任。","answer":"逐行为、逐主体分析故意内容，区分对象或因果进程错误，评价前后行为的罪数、未遂既遂和介入因素。"},{"no":"三","subject":"刑事诉讼法","topic":"侦查、证据与程序救济","prompt":"综合侦查取证、强制措施和审判程序事实判断程序是否合法。","answer":"按主体权限、期限、告知与救济、证据取得合法性分别审查，结论后写明排除或补救方式。"},{"no":"四","subject":"民法","topic":"合同、担保与物权变动","prompt":"在多方交易关系中识别合同效力、物权变动和担保责任。","answer":"先画法律关系图，再按合同效力—履行抗辩—担保从属性—物权公示顺序作答。"},{"no":"五","subject":"商法","topic":"公司治理与股东责任","prompt":"围绕公司决议、出资与对外交易分析公司及股东责任。","answer":"区分内部决议效力与外部交易效力，审查代表权限、善意相对人和股东出资责任。"},{"no":"六","subject":"民事诉讼法","topic":"当事人、管辖、证明责任","prompt":"在复杂民事纠纷中判断当事人、管辖、证明责任和裁判方式。","answer":"先处理程序门槛，再分配证明责任；实体结论与程序结论分段书写。"},{"no":"七","subject":"行政法","topic":"行政行为合法性与救济","prompt":"围绕行政许可或处罚争议判断主体、程序、复议诉讼与裁判。","answer":"以被诉行政行为为中心，依主体权限、事实证据、法律适用、法定程序、裁量审查五步展开。"}]},{"year":2017,"examName":"2017 年国家司法考试试卷四","confidence":"官方公布","sourceUrl":"https://www.moj.gov.cn/jgsz/jgszzsdw/zsdwgjsfkszx/gjsfkskskt/201805/t20180510_172368.html","answerUrl":"https://www.eol.cn/m/zige/201709/t20170922_1556036.shtml","note":"司法部公开题面；答案链接为公开转载页面。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"天理、国法、人情与司法公正","prompt":"围绕裁判如何兼顾法律效果、社会效果和公众认同展开论述。","answer":"坚持依法裁判是前提，通过释法说理、程序参与和价值衡量实现政治效果、法律效果、社会效果统一。"},{"no":"二","subject":"刑法","topic":"绑架、敲诈勒索、认识错误、遗弃","prompt":"行为人绑错儿童并索财，发生死亡、遗弃和处置尸体等事实，分析各阶段刑责。","answer":"按绑架故意、索财对象错误、死亡结果归责、后续遗弃或毁灭证据等逐段评价，并处理罪数。"},{"no":"三","subject":"刑事诉讼法","topic":"上诉抗诉、二审、再审与裁判效力","prompt":"强奸案一审无罪后检察机关抗诉，继而发生二审和再审，判断各程序及裁判效力。","answer":"区分抗诉类型与期限，审查二审全面审查、上诉不加刑适用和再审启动主体，最后确定生效裁判。"},{"no":"四","subject":"民法","topic":"借贷、让与担保、保证、买卖租赁与保险","prompt":"借款与房屋买卖担保、个人独资企业、保证质押、房屋转让出租和火灾保险交织。","answer":"按基础债权、担保安排效力、物权变动、买卖不破租赁与保险代位分别作答，避免一笔交易一概而论。"},{"no":"五","subject":"商法","topic":"资本减少、董监高、股份回购、解散清算","prompt":"公司治理中涉及减资、管理人员解任、股份回购及解散清算。","answer":"分别审查决议机关和程序、债权人保护、法定回购事由、忠实勤勉义务以及解散清算顺序。"},{"no":"六","subject":"民事诉讼法","topic":"高空坠物、当事人、送达、缺席审判","prompt":"窗户坠落致伤，题目连续追问管辖、当事人、证明责任、送达与缺席审判。","answer":"先锁定侵权责任主体及可能追加的当事人，再审查侵权地管辖、举证责任、合法送达和缺席裁判条件。"},{"no":"七","subject":"行政法","topic":"工业盐许可处罚、听证、复议、法治政府","prompt":"工业盐经营引发许可、处罚、听证、复议和被告争议，并要求论述放管服背景下的法治政府。","answer":"案例部分按许可或处罚性质、程序权利、复议决定及被告规则作答；论述部分围绕职能科学、权责法定、执法严明、公开公正和服务型政府。"}]},{"year":2018,"examName":"2018 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.233.com/sf/yijuan/zhenti/202004/26095349927.html","answerUrl":"https://www.233.com/sf/yijuan/zhenti/202004/26095349927.html","note":"改革后首届法考，官方不再公开完整试题和答案；以下为公开回忆版要点。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"中国特色社会主义法治道路","prompt":"论述坚定走中国特色社会主义法治道路的核心要求。","answer":"以党的领导、人民当家作主、依法治国有机统一为主线，说明道路自信、制度优势和实践要求。"},{"no":"二","subject":"刑法","topic":"信用卡、黑恶犯罪、绑架、枪支与结果归责","prompt":"POS 机超额刷卡、涉黑团伙、绑架、枪支及死亡结果等多行为综合分析。","answer":"按时间轴拆分各行为，处理财产犯罪、共同犯罪、绑架与死亡结果、枪支犯罪及罪数。"},{"no":"三","subject":"刑事诉讼法","topic":"证据、因果关系与法律文书","prompt":"要求围绕证据对死亡因果关系和延误救助进行判断，并完成法律文书式论证。","answer":"建立证据链，分别评价证据能力和证明力；结论必须回应合理怀疑及法律文书格式。"},{"no":"四","subject":"民法/民事诉讼法","topic":"借贷、保证、重复起诉","prompt":"借贷担保关系与民事诉讼程序交叉，涉及保证责任、诉讼标的和重复起诉。","answer":"先处理实体债权和保证，再对照当事人、诉讼标的、诉讼请求判断是否重复起诉。"},{"no":"五","subject":"商法","topic":"股权代持、出资、股权转让与善意取得","prompt":"围绕公司股权代持、出资义务和股权转让效力分析。","answer":"区分代持内部关系与外部登记效力，审查出资责任、转让处分权限及相对人善意。"},{"no":"选做","subject":"行政法","topic":"强制拆除、程序与赔偿","prompt":"对强制拆除行为的权限、程序、救济和损失赔偿进行分析。","answer":"分别判断强拆决定和实施行为，审查催告、公告、复议诉讼和行政赔偿举证。"}]},{"year":2019,"examName":"2019 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.233.com/sf/zhuguan/zhenti/201910/13175717788.html","answerUrl":"https://www.233.com/sf/zhuguan/zhenti/202212/13085256966559.html","note":"公开回忆题与教师解析综合整理。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"法治政府","prompt":"结合材料论述依法全面履行政府职能和法治政府建设。","answer":"围绕职权法定、权责统一、规范执法、公开监督和服务效能组织。"},{"no":"二","subject":"刑法","topic":"共同抢劫、诈骗、受贿、银行卡犯罪","prompt":"共同抢劫中的认识错误及死亡结果，与贷款诈骗、车辆质押诈骗、受贿、盗刷银行卡等连续事实。","answer":"按行为人和行为段落确定罪名、共同故意、结果归责、身份犯和罪数，不用一个总罪名包办。"},{"no":"三","subject":"刑事诉讼法","topic":"证据不足与无罪判决","prompt":"以证据体系存在矛盾为背景，判断能否达到排除合理怀疑及相应裁判。","answer":"逐项审查取证合法性和证明力，证据链不能闭合时贯彻疑罪从无。"},{"no":"四","subject":"民法/民事诉讼法","topic":"以物抵债、债权人撤销权、夫妻保证、票据质押","prompt":"多层合同担保事实涉及以物抵债、债权保全、夫妻一方保证、票据质押与诉讼保全。","answer":"先确定主债权，再分别判断代物清偿、撤销权要件、保证效力、票据质押公示及保全程序。"},{"no":"五","subject":"商法","topic":"股权质押、代持、重整与增资","prompt":"公司股权质押和代持关系进入重整、增资场景后的权利顺位。","answer":"以公司登记、质权设立、代持内部外部效力和重整程序中的权利申报为轴作答。"},{"no":"选做","subject":"行政法","topic":"行政许可与处罚救济","prompt":"行政机关作出许可或处罚后引发复议与诉讼。","answer":"按行为性质、原告资格、复议机关、被告和裁判方式完成闭环。"}]},{"year":2020,"examName":"2020 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.233.com/sf/zhuguan/zhenti/202012/01085212579.html","answerUrl":"https://www.233.com/sf/zhuguan/zhenti/202012/01085212579.html","note":"公开回忆题汇总。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"国家治理现代化、依法防疫","prompt":"结合疫情防控论述法治在国家治理体系和治理能力现代化中的作用。","answer":"从依法决策、依法行政、权利保障、应急治理和社会协同说明法治固根本、稳预期、利长远。"},{"no":"二","subject":"刑法","topic":"盗伐林木、职务犯罪、敲诈勒索与因果关系","prompt":"林木采伐、国家工作人员、装修纠纷、敲诈勒索、互殴及死亡结果交织。","answer":"逐段判断行为对象和身份，处理财产犯罪与职务犯罪、敲诈勒索、正当防卫或互殴、死亡结果归责。"},{"no":"三","subject":"刑事诉讼法","topic":"网络犯罪管辖、讯问录音录像、鉴定意见","prompt":"网络犯罪侦查涉及管辖，口供与同步录音录像不一致，价格认定材料性质存疑。","answer":"先审查管辖连接点；口供矛盾需结合录音录像判断合法性真实性；价格认定是否属于鉴定意见应依法定程序和主体资格判断。"},{"no":"四","subject":"民法/商法/民事诉讼法","topic":"房地产融资、保证、浮动抵押、破产重整","prompt":"房地产开发融资串联股东、保证、浮动抵押、赠与、销售广告、重整及鉴定程序。","answer":"按主体关系分层，先合同债权和担保顺位，再处理广告承诺、股东责任、破产受理后权利行使与诉讼程序。"},{"no":"选做一","subject":"行政法","topic":"拆迁补偿协议、仲裁条款、信息公开","prompt":"征收拆迁补偿协议约定仲裁，后又发生信息公开争议。","answer":"行政协议争议原则上走行政诉讼，仲裁约定效力须依行政协议可仲裁性判断；信息公开行为另行审查。"},{"no":"选做二","subject":"商法","topic":"员工持股、增资、关联交易、股东除名","prompt":"公司员工持股和增资后，董事关联贷款及股东除名引发争议。","answer":"分别审查出资程序、董事忠实义务与关联交易效力、股东除名的法定条件和催缴程序。"}]},{"year":2021,"examName":"2021 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.233.com/sf/zhuguan/zhenti/202112/20112947400432.html","answerUrl":"https://www.233.com/sf/zhuguan/zhenti/202112/20112947400432.html","note":"部分考区延期，公开资料存在常规卷与延期卷，使用时先核对卷别。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"以人民为中心的法治建设","prompt":"论述全面依法治国为什么必须坚持以人民为中心。","answer":"以人民主体地位、权益保障、公平正义、全过程人民民主和法治成果共享构建论证。"},{"no":"二","subject":"刑法","topic":"抢劫、信用卡、生产销售伪劣产品、财产性利益","prompt":"儿童受胁取财、手机银行与信用卡、低档酒冒充、为逃债杀人并取财等事实。","answer":"区分盗窃转化、抢劫胁迫，信用卡和网络支付犯罪，诈骗与伪劣产品犯罪，以及财产性利益能否成为抢劫对象。"},{"no":"三","subject":"刑事诉讼法","topic":"逮捕比例、认罪认罚、非法证据、回避","prompt":"考查逮捕必要性、认罪认罚、非法证人证言及派生电子数据、回避与庭前会议。","answer":"分别从强制措施比例原则、程序自愿真实、非法证据排除范围、回避事由与庭前解决程序问题作答。"},{"no":"四","subject":"民法/民事诉讼法","topic":"高空抛物、监护、二维码收款、机会损失","prompt":"未成年人高空抛物，物业安全保障、收款二维码、监护责任、缔约机会损失及执行和解交织。","answer":"区分直接侵权、监护人责任和物业补充责任；合同部分审查表见代理或不当得利、可预见损失；程序部分处理送达、上诉和执行和解。"},{"no":"五","subject":"商法","topic":"资本公积、董事责任、投资协议与出资","prompt":"资本溢价、董事忠实勤勉义务、补偿协议、股东会决议和出资责任。","answer":"明确资本公积用途与程序，审查董事责任归属、对赌或补偿协议效力、决议瑕疵及出资责任。"},{"no":"选做","subject":"行政法","topic":"土地收回、行政赔偿、二审裁判","prompt":"土地收回引发原告被告、行为性质、赔偿证明、第三人和二审漏判补偿问题。","answer":"先定性收回行为和当事人；赔偿举证结合行政机关违法造成证据灭失规则；二审对漏判请求依法处理。"}]},{"year":2022,"examName":"2022 年国家统一法律职业资格考试主观题（延期至 2023 年举行）","confidence":"回忆版·待逐题复核","sourceUrl":"https://ks.233.com/tiku/exam/item/425281","answerUrl":"https://www.233.com/sf/yijuan/zhenti/202209/09142239864179.html","note":"主观题考试延期至 2023-03-26；公开在线题库显示 180 分、240 分钟、1 道论述题和 5 道案例题。当前保留整卷入口，不对未稳定索引的逐题题面作推断。","subQuestions":[{"no":"整卷","subject":"综合","topic":"一论述题、五案例题","prompt":"2022 年主观题整卷公开回忆入口；逐题题面需在在线题库中核对。","answer":"建议在原页面按卷别查看。由于公开索引不稳定，本版不填充未经核验的具体案情和结论。"}]},{"year":2023,"examName":"2023 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.233.com/sf/zhuguan/zhenti/","answerUrl":"https://www.233.com/sf/zhuguan/zhenti/202310/13163755524462.html","note":"按科目公开回忆与教师解析汇总。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"全面依法治国","prompt":"结合年度材料论述全面依法治国相关命题。","answer":"原公开页面可访问但摘要未稳定呈现完整题干，本库保留科目入口，答题应以材料关键词确定中心论点。"},{"no":"二","subject":"刑法","topic":"帮助信息网络犯罪、侵占/职务行为、自首","prompt":"出售银行卡帮助电诈并伴随侵占等行为，重点分析陆某的犯罪和自首。","answer":"审查明知程度和帮助行为与上游诈骗的关系，区分帮信与诈骗共犯；再判断财物占有基础和投案、如实供述范围。"},{"no":"三","subject":"刑事诉讼法","topic":"年龄证据、合理怀疑、二审处理","prompt":"抢劫者向盗窃者索财，案件存在年龄证据矛盾，要求判断证明标准和二审处理。","answer":"刑事责任年龄必须证据确实充分；无法排除合理怀疑时作有利被告判断，二审依一审事实证据和程序错误选择改判或发回。"},{"no":"四","subject":"民法/民事诉讼法","topic":"合同、物权与程序综合","prompt":"年度民事综合回忆题，覆盖合同履行、担保和诉讼程序。","answer":"按法律关系图拆分请求权基础，再写抗辩、担保顺位和程序处理。"},{"no":"五","subject":"商法","topic":"公司资本、法定代表人、出资加速到期、破产","prompt":"公司资本运作、法定代表人订约、股东出资加速到期与破产程序。","answer":"区分代表权限内部限制与外部效力，审查出资期限利益的例外、债权人保护和破产受理后的集中清偿。"},{"no":"选做","subject":"行政法","topic":"行政行为与救济综合","prompt":"年度行政法选做回忆题。","answer":"按行政主体、行为性质、合法性、复议诉讼和裁判方式五层组织；具体结论以原页卷别为准。"}]},{"year":2024,"examName":"2024 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.weibo.com/ttarticle/p/show?id=2309635092622849933391","answerUrl":"https://www.weibo.com/ttarticle/p/show?id=2309635092622849933391","note":"公开机构教师回忆与解析合辑。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"高水平社会主义市场经济与法治保障","prompt":"论述法治如何保障高水平社会主义市场经济和改革发展。","answer":"以产权保护、公平竞争、统一市场、规范政府行为和稳定预期为论证层次。"},{"no":"二","subject":"刑法","topic":"冒充警察、电信诈骗、预备未遂、共同犯罪","prompt":"冒充警察实施电信诈骗，涉及犯罪预备与未遂；同伙入户并取得香烟等财物。","answer":"逐人判断共同故意和分工，识别诈骗着手与未遂，另评入户取财行为及罪数。"},{"no":"三","subject":"刑事诉讼法","topic":"取保候审、上诉不加刑、抗诉","prompt":"围绕取保候审期限、上诉或抗诉后的二审裁判限制等问题。","answer":"核对强制措施期限和变更解除义务；仅被告上诉时适用上诉不加刑，有检察抗诉等情形另论。"},{"no":"四","subject":"民法/民事诉讼法","topic":"民商事综合","prompt":"年度民商事综合回忆题，涵盖合同、担保及诉讼处理。","answer":"以请求权基础为主线，程序问题单独编号，避免实体程序混写。"},{"no":"五","subject":"商法","topic":"公司与破产综合","prompt":"公司治理、出资和破产相关年度选做题。","answer":"依公司资本规则、决议权限、董监高责任和破产集中清偿顺序作答。"},{"no":"选做","subject":"行政法","topic":"行政行为合法性综合","prompt":"行政法年度选做题，涉及行政执法与诉讼救济。","answer":"对每一问先定性行为，再写主体、依据、程序、裁量和救济。"}]},{"year":2025,"examName":"2025 年国家统一法律职业资格考试主观题","confidence":"回忆版·多源核验","sourceUrl":"https://www.sohu.com/a/943712564_121124302","answerUrl":"https://www.sohu.com/a/943712564_121124302","note":"公开机构教师回忆与解析合辑；不同老师对个别争点可能有分歧。","subQuestions":[{"no":"一","subject":"习近平法治思想/法理","topic":"中华法治文明与理论创新","prompt":"围绕中华法治文明，论述马克思主义基本原理同中国具体实际、中华优秀传统文化相结合。","answer":"以理论根基、文化传承、实践创新和建设中国特色社会主义法治体系为层次，避免只罗列口号。"},{"no":"二","subject":"刑法","topic":"刑法综合案例","prompt":"年度刑法回忆题为多行为、多主体综合案例。","answer":"先列时间轴和行为人，再逐行为判断构成要件、形态、共同犯罪、罪数和量刑情节；具体事实以原页为准。"},{"no":"三","subject":"刑事诉讼法","topic":"认罪认罚、行政处罚材料、鉴定、侦查实验、抗诉","prompt":"郑某案涉及认罪认罚、既往行政处罚材料用途、受污染血样鉴定、侦查实验、证人证言及期限后补充抗诉。","answer":"分别审查认罪认罚自愿真实性、行政材料转化使用条件、鉴定检材可靠性、侦查实验程序、证言审查和抗诉期限；程序违法与证据排除不可一概而论。"},{"no":"四","subject":"民法/民事诉讼法","topic":"民商事综合","prompt":"年度民商事综合回忆题，包含多重合同和程序争点。","answer":"建立人物关系与请求权表，按合同效力、履行、担保、侵权或不当得利及程序逐问回应。"},{"no":"五","subject":"商法","topic":"公司法与破产法","prompt":"年度商法选做题围绕新公司法语境下的资本与治理。","answer":"优先核对新公司法施行后的出资期限、股东责任、决议和董监高义务，再处理破产影响。"},{"no":"选做","subject":"行政法","topic":"行政法综合","prompt":"行政执法、复议或诉讼救济综合回忆题。","answer":"逐问标出行为性质、主体、程序和裁判方式；与教师答案冲突处保留分歧，不把回忆版写成官方答案。"}]}],"coverage":[{"institution":"方圆众合","teachers":"李佳、孟献贵","status":"已收录","detail":"公开核验到李佳主观题每日一题 13 道；孟献贵民商法案例带学训练营第 225—232 题作为高质量样本收录。","sourceUrl":"https://www.sina.cn/media/1552849431"},{"institution":"瑞达法考","teachers":"蔡雅奇、王斌、钟秀勇、徐金桂、杨雄、李晗、宋光明、李晓晓等","status":"持续追踪","detail":"官网可核验 2026 主观题课程与师资，但未检索到无需登录、可逐题核验的主观题“每日一题”公开归档。","sourceUrl":"https://www.ruidaedu.com/book/"},{"institution":"厚大法考","teachers":"公开课程师资","status":"持续追踪","detail":"官网及公开视频可确认主观题课程；部分题库属于课程或付费资料，本库不复制受限内容。","sourceUrl":"https://www.houdask.com/"},{"institution":"觉晓法考","teachers":"公开课程师资","status":"持续追踪","detail":"检索到公开经验与课程资源，但尚未找到稳定、逐题带答案的 2026 主观题日练公开归档。","sourceUrl":"https://www.juexiaotime.com/official/storyResourses/dist/story-933.html"},{"institution":"桑磊法考","teachers":"桑磊团队","status":"持续追踪","detail":"官网可核验 2026 课程安排，未发现无需登录的主观题每日一题完整归档。","sourceUrl":"https://www.sangleifakao.com/"},{"institution":"柏杜法考","teachers":"柏浪涛等","status":"已排除误收","detail":"检索到的高频“每日一题”多为客观题训练，不并入主观题库。","sourceUrl":"https://www.sina.cn/media/7424709715"},{"institution":"文都法考","teachers":"公开课程师资","status":"持续追踪","detail":"未检索到稳定可公开核验的 2026 主观题每日一题归档；保留机构观察位。","sourceUrl":"https://www.wendu.com/"},{"institution":"众合刑诉等客观日题","teachers":"左宁等","status":"已排除误收","detail":"公开视频标题或课程信息明确标注“客观每日一题”，即使按主观 全面依法治国沿着正确政治方向推进。","skeleton":["法治之魂","根本保证","制度机制","全过程各方面","领导立法","保证执法","支持司法","带头守法"],"selfCheck":["党的领导在全面依法治国中的定位是什么？","如何处理党的领导与依法治国的关系？","全过程领导的四个落点是什么？"],"sourceUrl":"https://www.qstheory.cn/20260214/f410c8f7798c41e89ed15604d92c4915/c.html","authorityUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","verifiedAt":"2026-08-31","status":"权威来源已核验"},{"id":"rule-of-law-02","order":2,"date":"2026-08-31","series":"十二个坚持","channelId":"official-rule-of-law-thought","sourceType":"权威纲要","topic":"坚持以人民为中心","importance":"必背","question":"全面依法治国为什么必须坚持以人民为中心？","publishedGist":"以人民为中心是全面依法治国的根本立场，法治建设要为了人民、依靠人民、保护人民。","memorization":"人民是全面依法治国最广泛、最深厚的基础。推进法治建设，根本目的是依法保障人民权益、维护社会公平正义、促进人的全面发展。必须把体现人民利益、反映人民愿望、维护人民权益、增进人民福祉落实到法治建设全过程，使法律及其实施充分体现人民意志；同时依靠人民推进法治，通过全过程人民民主吸收民意、汇集民智，让人民在每一项法律制度、每一个执法决定、每一宗司法案件中感受到公平正义。","skeleton":["根本立场","为了人民","依靠人民","保障权益","公平正义","全过程人民民主","法治获得感"],"selfCheck":["人民在全面依法治国中的地位是什么？","“为了人民”和“依靠人民”分别如何展开？","公平正义如何落到具体法治环节？"],"sourceUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","authorityUrl":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/xxxcgcxjpfzsx/fzsxpljj/202511/t20251125_528487.html","verifiedAt":"2026-08-31","status":"权威来源已核验"},{"id":"rule-of-law-03","order":3,"date":"2026-08-31","series":"十二个坚持","channelId":"official-rule-of-law-thought","sourceType":"权威纲要","topic":"坚持中国特色社会主义法治道路","importance":"必背","question":"中国特色社会主义法治道路的核心要义是什么？","publishedGist":"坚持中国特色社会主义法治道路是全面依法治国的唯一正确道路。","memorization":"全面依法治国必须走中国特色社会主义法治道路。其核心要义是坚持党的领导、坚持中国特色社会主义制度、贯彻中国特色社会主义法治理论，三者统一于中国特色社会主义法治伟大实践。既要学习借鉴世界优秀法治文明成果，又必须从我国国情和实际出发，决不能照搬别国模式和做法。道路自信最终体现为坚持和完善中国特色社会主义法治体系，运用法治保障中国式现代化。","skeleton":["唯一正确道路","党的领导","社会主义制度","法治理论","三者统一","立足国情","借鉴不照搬"],"selfCheck":["道路的三项核心要义是什么？","如何对待域外法治经验？","道路自信如何转化为制度实践？"],"sourceUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","authorityUrl":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/xxxcgcxjpfzsx/fzsxpljj/202511/t20251125_528487.html","verifiedAt":"2026-08-31","status":"权威来源已核验"},{"id":"rule-of-law-04","order":4,"date":"2026-08-31","series":"十二个坚持","channelId":"official-rule-of-law-thought","sourceType":"权威纲要","topic":"坚持依宪治国、依宪执政","importance":"必背","question":"如何理解依宪治国、依宪执政是全面依法治国的首要任务？","publishedGist":"宪法是国家根本法，坚持依法治国首先要坚持依宪治国。","memorization":"宪法是国家根本法，是治国安邦的总章程，具有最高法律地位、法律权威和法律效力。坚持依法治国首先要坚持依宪治国，坚持依法执政首先要坚持依宪执政。必须全面贯彻实施宪法，完善以宪法为核心的中国特色社会主义法律体系，健全保证宪法全面实施的制度体系，加强宪法监督，推进合宪性审查，维护国家法治统一，并通过宪法宣传教育增强全社会宪法意识。","skeleton":["根本法","总章程","最高效力","依宪治国","依宪执政","宪法实施","宪法监督","合宪性审查"],"selfCheck":["宪法的三个效力定位是什么？","宪法实施和监督分别包含什么？","依宪治国与依宪执政如何衔接？"],"sourceUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","authorityUrl":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/xxxcgcxjpfzsx/fzsxpljj/202511/t20251125_528487.html","verifiedAt":"2026-08-31","status":"权威来源已核验"},{"id":"rule-of-law-05","order":5,"date":"2026-08-31","series":"十二个坚持·2026 新表述","channelId":"official-rule-of-law-thought","sourceType":"2025版纲要更新","topic":"在法治轨道上全面建设社会主义现代化国家","importance":"新增必背","question":"为什么必须在法治轨道上全面建设社会主义现代化国家？","publishedGist":"第五个坚持已从国家治理现代化拓展为在法治轨道上全面建设社会主义现代化国家。","memorization":"法治是中国式现代化的重要保障。全面建设社会主义现代化国家，必须更好发挥法治固根本、稳预期、利长远的保障作用，把国家各项事业和各项工作全面纳入法治轨道。要以法治巩固根本制度、基本制度和重要制度，以稳定透明规范可预期的制度环境促进发展，以法治方式统筹改革、发展、稳定和安全，并使现代化建设在制度化、规范化、程序化轨道上持续推进。","skeleton":["2026新表述","中国式现代化","固根本","稳预期","利长远","全面纳入法治轨道","改革发展稳定安全"],"selfCheck":["第五项旧表述和新表述有什么区别？","法治保障现代化的三项功能是什么？","如何体现国家各方面工作法治化？"],"sourceUrl":"https://www.npc.gov.cn/npc/c2/c30834/202602/t20260213_451578.html","authorityUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","verifiedAt":"2026-08-31","status":"2026 新表述已核验"},{"id":"rule-of-law-06","order":6,"date":"2026-08-31","series":"十二个坚持","channelId":"huzhen-weibo","sourceType":"教师高频设问+权威复核","topic":"建设中国特色社会主义法治体系","importance":"必背","question":"为什么建设中国特色社会主义法治体系，它包括哪些内容？","publishedGist":"法治体系是全面依法治国的总抓手，包含法律规范、实施、监督、保障和党内法规五个体系。","memorization":"全面依法治国是涉及立法、执法、司法、守法各环节的系统工程，必须以建设中国特色社会主义法治体系为总抓手。在党的领导下，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论，形成完备的法律规范体系、高效的法治实施体系、严密的法治监督体系、有力的法治保障体系和完善的党内法规体系。五个体系相互联系、彼此支撑，共同把制度优势转化为依法治国效能。","skeleton":["系统工程","总抓手","党的领导","制度与理论","法律规范","法治实施","法治监督","法治保障","党内法规"],"selfCheck":["法治体系为什么是总抓手？","五个体系能否完整写出？","五个体系之间是什么关系？"],"sourceUrl":"https://www.sina.cn/media/1199079185","authorityUrl":"https://www.npc.gov.cn/npc/c2/c30834/202603/t20260325_453450.html","verifiedAt":"2026-08-31","status":"教师设问与权威表述已交叉核验"},{"id":"rule-of-law-07","order":7,"date":"2026-08-31","series":"十二个坚持","channelId":"official-rule-of-law-thought","sourceType":"权威纲要","topic":"共同推进与一体建设","importance":"必背","question":"如何理解依法治国、依法执政、依法行政共同推进和法治国家、法治政府、法治社会一体建设？","publishedGist":"共同推进明确推进方式，一体建设明确整体目标和工作布局。","memorization":"依法治国、依法执政、依法行政是有机整体，关键在于党依法执政、各级政府依法行政。法治国家、法治政府、法治社会相辅相成，法治国家是目标，法治政府是重点任务和主体工程，法治社会是基础。推进全面依法治国，必须统筹兼顾、把握重点、整体谋划，在共同推进上着力，在一体建设上用劲，形成职责明确、依法行政的政府治理体系和共建共治共享的社会治理格局。","skeleton":["共同推进","党依法执政","政府依法行政","法治国家目标","法治政府重点","法治社会基础","统筹一体"],"selfCheck":["三个“依法”中关键是什么？","国家、政府、社会各自定位是什么？","共同推进和一体建设有何区别？"],"sourceUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","authorityUrl":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/xxxcgcxjpfzsx/fzsxpljj/202511/t20251125_528487.html","verifiedAt":"2026-08-31","status":"权威来源已核验"},{"id":"rule-of-law-08","order":8,"date":"2026-08-31","series":"十二个坚持","channelId":"huzhen-weibo","sourceType":"教师高频设问+权威复核","topic":"科学立法、严格执法、公正司法、全民守法","importance":"必背","question":"如何全面推进科学立法、严格执法、公正司法、全民守法？","publishedGist":"四个环节共同构成全面依法治国的重要环节，分别对应良法、实施、公正和社会基础。","memorization":"全面依法治国必须抓住立法、执法、司法、守法四个重要环节。科学立法要完善法律体系，提高立法质量和效率，以良法促进发展、保障善治；严格执法要坚持法定职责必须为、法无授权不可为，推进规范公正文明执法；公正司法要坚持事实根据和法律准绳，实现实体公正与程序公正；全民守法要弘扬法治精神、加强普法，使尊法学法守法用法成为共同追求。","skeleton":["良法善治","法定职责必须为","法无授权不可为","实体程序公正","尊学守用","四环相扣"],"selfCheck":["四个环节各自的核心目标是什么？","严格执法的正反两句是什么？","公正司法为什么必须兼顾实体与程序？"],"sourceUrl":"https://www.sina.cn/media/1199079185","authorityUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","verifiedAt":"2026-08-31","status":"教师设问与权威表述已交叉核验"},{"id":"rule-of-law-09","order":9,"date":"2026-07-10","series":"胡震 2026 主观考点每日带背","channelId":"huzhen-weibo","sourceType":"教师公开带背+权威复核","topic":"统筹推进国内法治和涉外法治","importance":"高频","question":"如何统筹推进国内法治和涉外法治？","publishedGist":"应加强涉外法治战略布局、制度建设、执法司法效能和涉外法治人才培养。","memorization":"统筹推进国内法治和涉外法治，是全面依法治国的迫切任务。要加快涉外法治工作战略布局，完善涉外法律法规体系和法治实施体系，提升涉外执法司法效能；依法维护国家主权、安全、发展利益和我国公民、法人在海外的合法权益；积极参与国际规则制定，推动国际关系法治化；加强涉外法治专业人才培养，形成系统完备、协同高效的涉外法治工作格局。","skeleton":["迫切任务","战略布局","涉外规则体系","执法司法效能","海外权益","国际规则","涉外人才"],"selfCheck":["涉外法治保护哪些核心利益？","国内法治和涉外法治如何协同？","人才建设为何单独强调？"],"sourceUrl":"https://www.sina.cn/news/detail/5319019860066466.html","authorityUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","verifiedAt":"2026-08-31","status":"公开单篇与权威表述已交叉核验"},{"id":"rule-of-law-10","order":10,"date":"2026-08-31","series":"十二个坚持","channelId":"official-rule-of-law-thought","sourceType":"2026 权威理论资料","topic":"建设德才兼备的高素质法治工作队伍","importance":"高频","question":"为什么以及如何建设德才兼备的高素质法治工作队伍？","publishedGist":"法治工作队伍是全面依法治国的基础性保障，要推进革命化、正规化、专业化、职业化建设。","memorization":"全面推进依法治国，必须建设一支忠于党、忠于国家、忠于人民、忠于法律的社会主义法治工作队伍。要把政治标准放在首位，加强理想信念、职业伦理和纪律作风教育；推进法治专门队伍革命化、正规化、专业化、职业化建设，提高运用法治思维和法治方式解决问题的能力；加强法律服务队伍建设和法治人才培养，为建设更高水平法治中国提供坚实人才保障。","skeleton":["基础性保障","四个忠于","政治标准","职业伦理","四化建设","法治思维方式","人才培养"],"selfCheck":["法治队伍建设的定位是什么？","四个忠于和四化建设分别是什么？","专业能力如何体现？"],"sourceUrl":"https://www.qstheory.cn/20260611/6e2705c864ae4097b458e0a44bddb024/c.html","authorityUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","verifiedAt":"2026-08-31","status":"2026 权威资料已核验"},{"id":"rule-of-law-11","order":11,"date":"2026-08-31","series":"十二个坚持","channelId":"official-rule-of-law-thought","sourceType":"权威纲要","topic":"抓住领导干部这个关键少数","importance":"高频","question":"为什么全面依法治国必须抓住领导干部这个关键少数？","publishedGist":"领导干部是全面依法治国的重要组织者、推动者和实践者，必须带头尊法学法守法用法。","memorization":"领导干部具体行使党的执政权和国家立法权、行政权、监察权、司法权，是全面依法治国的重要组织者、推动者和实践者。领导干部是否尊崇法治、厉行法治，直接影响全社会法治信仰。必须带头尊法学法守法用法，提高运用法治思维和法治方式深化改革、推动发展、化解矛盾、维护稳定、应对风险的能力，严格依法用权，自觉接受监督，以关键少数带动绝大多数。","skeleton":["重要组织推动实践者","示范效应","尊学守用","法治思维方式","依法用权","接受监督","带动绝大多数"],"selfCheck":["领导干部为什么具有关键作用？","法治思维要解决哪五类任务？","如何防止以言代法、以权压法？"],"sourceUrl":"https://www.qstheory.cn/20260508/412e057fdcbe4461a2f7a67cc8bc50b0/c.html","authorityUrl":"https://www.12371.cn/2025/02/06/ARTI1738807387913394.shtml","verifiedAt":"2026-08-31","status":"权威来源已核验"},{"id":"rule-of-law-12","order":12,"date":"2026-08-31","series":"十二个坚持·2026 新增","channelId":"official-rule-of-law-thought","sourceType":"2025版纲要新增","topic":"依法治国和依规治党有机统一","importance":"新增必背","question":"如何理解依法治国和依规治党有机统一？","publishedGist":"这是第十二个坚持，揭示治国与治党在法治轨道上的内在统一。","memorization":"依法治国是党领导人民治理国家的基本方式，依规治党是党管党治党的基本方式，二者本质一致、目标一致、功能互补。必须坚持依法治国与制度治党、依规治党统筹推进、一体建设，健全党内法规同国家法律法规衔接协调机制，使党依据宪法法律治国理政，又依据党内法规管党治党。通过纪法贯通、法法衔接，把党的领导制度化、法治化、规范化，为党长期执政和国家长治久安提供制度保障。","skeleton":["第十二个坚持","治国基本方式","治党基本方式","统筹推进一体建设","党规国法衔接","纪法贯通","长期执政长治久安"],"selfCheck":["依法治国和依规治党各自是什么基本方式？","二者为什么能够有机统一？","制度衔接的关键机制是什么？"],"sourceUrl":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/xxxcgcxjpfzsx/fzsxllqy/202607/t20260701_537051.html","authorityUrl":"https://www.moj.gov.cn/pub/sfbgw/zwgkztzl/xxxcgcxjpfzsx/fzsxpljj/202511/t20251125_528487.html","verifiedAt":"2026-08-31","status":"2026 新增内容已核验"},{"id":"rule-of-law-13","order":13,"date":"2026-08-31","series":"体系专题","channelId":"huzhen-weibo","sourceType":"教师高频设问+权威复核","topic":"完备的法律规范体系","importance":"高频","question":"如何建设完备的法律规范体系？","publishedGist":"坚持立法先行，推进科学、民主、依法立法，加强重点、新兴、涉外领域立法。","memorization":"建设完备的法律规范体系，必须坚持立法先行，发挥立法的引领和推动作用。要统筹立改废释纂，推进科学立法、民主立法、依法立法，增强立法系统性、整体性、协同性、时效性；加强重点领域、新兴领域和涉外领域立法，及时把成熟改革成果上升为法律制度；健全宪法实施和监督制度，维护国家法治统一，以高质量立法保障高质量发展和善治。","skeleton":["立法先行","立改废释纂","科学民主依法","系统整体协同时效","重点新兴涉外","改革成果制度化","良法善治"],"selfCheck":["立法工作的三种方法是什么？","五种立法技术是什么？","新时期重点立法领域有哪些？"],"sourceUrl":"https://www.sina.cn/media/1199079185","authorityUrl":"https://www.npc.gov.cn/npc/c2/c30834/202603/t20260325_453450.html","verifiedAt":"2026-08-31","status":"教师设问与权威表述已交叉核验"},{"id":"rule-of-law-14","order":14,"date":"2026-08-31","series":"体系专题","channelId":"huzhen-weibo","sourceType":"教师高频设问+权威复核","topic":"高效实施、严密监督与有力保障","importance":"高频","question":"如何建设高效的法治实施体系、严密的法治监督体系和有力的法治保障体系？","publishedGist":"实施体系强调法律有效执行，监督体系强调权力制约，保障体系强调政治、组织、人才、科技等支撑。","memorization":"高效的法治实施体系要求宪法法律全面有效实施，行政机关严格规范公正文明执法，司法机关公正司法，全社会自觉守法。严密的法治监督体系要求健全党和国家监督体系，加强对立法、执法、司法和守法各环节的制约监督，确保权力依法正确行使。有力的法治保障体系则要强化政治、组织、队伍、人才、科技和信息化保障，使实施、监督与保障相互衔接，共同提升法治体系整体效能。","skeleton":["实施有效","严格执法","公正司法","全民守法","权力制约监督","政治组织队伍人才科技","整体效能"],"selfCheck":["实施体系覆盖哪些主体？","监督体系的核心目标是什么？","保障体系有哪些支撑要素？"],"sourceUrl":"https://www.sina.cn/media/1199079185","authorityUrl":"https://www.npc.gov.cn/npc/c2/c30834/202603/t20260325_453450.html","verifiedAt":"2026-08-31","status":"教师设问与权威表述已交叉核验"}]},"records":[{"id":"2026-lijia-13","date":"2026-08-30","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"环境行政执法、原告资格、损害救济","title":"第 13 题｜诊所排放导致鱼类死亡的多重责任","questionSummary":"卫健局查处医美诊所违法排放，题目考查证据先行登记保存、审判延期、第三人退庭与自然人死亡后的诉讼处理。","questionText":"任某在乙县经营医美诊所，长期把未经处理的医疗废水和带血棉签等医疗废物倾倒至公共排水渠，造成相邻小区景观池恶臭、景观鱼大量死亡。县卫健局接到居民陆某举报后现场检查，对排水渠残留物和诊所监控硬盘采取证据先行登记保存；七日后检测确认污染严重，遂以违反医疗废物管理规定为由对任某罚款 2 万元。任某起诉，法院通知陆某作为第三人参加诉讼。\n\n请回答：\n1. 采取证据先行登记保存的法定条件和程序是什么？\n2. 庭审中法院认为需要通知新的证人到庭，应如何处理？\n3. 第三人陆某未经法庭许可中途退庭，法院应如何处理？\n4. 诉讼中任某突发心脏病死亡，法院应如何处理？","trainingQuestions":["先行登记保存须满足何种证据风险、审批和七日处理要求？","需要通知新证人到庭时应延期审理还是中止诉讼？","第三人未经许可中途退庭应按撤诉、缺席审理还是其他方式处理？","原告死亡后案件应先中止还是终结，取决于哪些继承与诉讼承受事实？"],"sourceAnswer":"截至 2026-08-31，本库已定位并保存完整题目单篇页；当天公布答案的单篇公开镜像尚未形成稳定索引，因此本条只提供完整原创作答，不把推演标成教师公布答案。","organizedAnswer":["证据可能灭失或以后难以取得时，经行政机关负责人批准可以先行登记保存，并应在七日内及时作出处理决定；保存期间不得销毁或转移证据。","庭审中需要通知新证人到庭的，法院应当延期审理，而非中止诉讼。","第三人未经法庭许可中途退庭，不影响案件审理的，可以缺席审理；不能把第三人直接按原告撤诉处理。","原告死亡后，如案件所涉权利义务可由近亲属承受，应先中止诉讼并等待有权主体表明是否参加；无人承受或依法不需继续审理时，再终结诉讼。"],"pitfall":"把延期审理与中止诉讼混淆；把第三人退庭机械写成按撤诉；原告死亡后不审查诉讼承受就直接终结。","answerState":"答案待公开复核","confidence":"题面已核验·答案待核验","sourceUrl":"https://www.sina.cn/news/detail/5337522529634735.html","verifiedAt":"2026-08-31","shelf":"2026 每日一题","year":2026,"answerUrl":"https://www.sina.cn/news/detail/5337522529634735.html","coreAnswer":"截至 2026-08-31，本库已定位并保存完整题目单篇页；当天公布答案的单篇公开镜像尚未形成稳定索引，因此本条只提供完整原创作答，不把推演标成教师公布答案。 证据可能灭失或以后难以取得时，经行政机关负责人批准可以先行登记保存，并应在七日内及时作出处理决定；保存期间不得销毁或转移证据。 庭审中需要通知新证人到庭的，法院应当延期审理，而非中止诉讼。 第三人未经法庭许可中途退庭，不影响案件审理的，可以缺席审理；不能把第三人直接按原告撤诉处理。 原告死亡后，如案件所涉权利义务可由近亲属承受，应先中止诉讼并等待有权主体表明是否参加；无人承受或依法不需继续审理时，再终结诉讼。","note":"答案核验状态：答案待公开复核。","completeQuestion":"任某在乙县经营医美诊所，长期把未经处理的医疗废水和带血棉签等医疗废物倾倒至公共排水渠，造成相邻小区景观池恶臭、景观鱼大量死亡。县卫健局接到居民陆某举报后现场检查，对排水渠残留物和诊所监控硬盘采取证据先行登记保存；七日后检测确认污染严重，遂以违反医疗废物管理规定为由对任某罚款 2 万元。任某起诉，法院通知陆某作为第三人参加诉讼。\n\n请回答：\n1. 采取证据先行登记保存的法定条件和程序是什么？\n2. 庭审中法院认为需要通知新的证人到庭，应如何处理？\n3. 第三人陆某未经法庭许可中途退庭，法院应如何处理？\n4. 诉讼中任某突发心脏病死亡，法院应如何处理？","completeAnswer":{"conclusion":"截至 2026-08-31，本库已定位并保存完整题目单篇页；当天公布答案的单篇公开镜像尚未形成稳定索引，因此本条只提供完整原创作答，不把推演标成教师公布答案。 证据可能灭失或以后难以取得时，经行政机关负责人批准可以先行登记保存，并应在七日内及时作出处理决定；保存期间不得销毁或转移证据。 庭审中需要通知新证人到庭的，法院应当延期审理，而非中止诉讼。 第三人未经法庭许可中途退庭，不影响案件审理的，可以缺席审理；不能把第三人直接按原告撤诉处理。 原告死亡后，如案件所涉权利义务可由近亲属承受，应先中止诉讼并等待有权主体表明是否参加；无人承受或依法不需继续审理时，再终结诉讼。","rules":["行政诉讼原告资格要求行政行为与所主张权益之间存在法律上的利害关系。应审查相关规范是否旨在保护该权益、行政行为是否直接增减其权利义务，不能仅凭一般经济影响认定。"],"application":"1. 证据可能灭失或以后难以取得时，经行政机关负责人批准可以先行登记保存，并应在七日内及时作出处理决定；保存期间不得销毁或转移证据。\n2. 庭审中需要通知新证人到庭的，法院应当延期审理，而非中止诉讼。\n3. 第三人未经法庭许可中途退庭，不影响案件审理的，可以缺席审理；不能把第三人直接按原告撤诉处理。\n4. 原告死亡后，如案件所涉权利义务可由近亲属承受，应先中止诉讼并等待有权主体表明是否参加；无人承受或依法不需继续审理时，再终结诉讼。","branches":"如公开回忆或教师解析存在不同观点，先写通说或更有评分可能的观点，再说明另一观点的规范理由。无论采用何种观点，前提、规则、涵摄与结论必须一致。","conciseSummary":["核心争点：环境行政执法、原告资格、损害救济。","结论要旨：截至 2026-08-31，本库已定位并保存完整题目单篇页；当天公布答案的单篇公开镜像尚未形成稳定索引，因此本条只提供完整原创作答，不把推演标成教师公布答案。 证据可能灭失或以后难以取得时，经行政机关负责人批准可以先行登记保存，并应在七日内及时作出处理决定；保存期间不得销毁或转移证据。 庭审中需要通知新证人到庭的，法院应当延期审理，而非中止诉讼。 第三人未经法庭许可中途退庭，不影响案件审理的，可以缺席审理；不能把第三人直接按原告撤诉处理。 原告死亡后，如案件所涉权利义务可由近亲属承受，应先中止诉讼并等待有权主体表明是否参加；无人承受或依法不需继续审理时，再终结诉讼。","落笔顺序：结论先行—规范依据—事实涵摄—争议分支—最终结论。"]},"completeness":{"label":"来源待复核","tone":"pending"}},{"id":"2026-lijia-12","date":"2026-08-29","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"行政处罚调查、询问笔录","title":"第 12 题｜酒后无证驾驶的调查与询问程序","questionSummary":"公安机关处理酒后偷开机动车案件，综合考查询问程序、异地询问、治安案件期限、规范性文件附带审查与裁量基准适用。","questionText":"2026 年 2 月 7 日，董某酒后偷开邻居冯某的奥迪汽车上路。甲市公安局乙区分局接警后传唤董某，并询问证人王某和被侵害人。2 月 10 日，区公安分局依据治安管理处罚法和本局裁量基准，对董某处行政拘留 10 日并罚款 1,000 元。董某于 2 月 15 日申请行政复议，并请求附带审查区公安分局制定的行政处罚裁量基准。\n\n请回答：\n1. 公安机关询问王某应遵守哪些要求？\n2. 冯某不在甲市时，可以通过哪些方式询问？\n3. 治安案件法定办案期限如何计算和延长？\n4. 复议机关如何处理对裁量基准的附带审查请求？\n5. 题设处罚是否符合该裁量基准？","trainingQuestions":["询问证人时出示证件、笔录核对与书面陈述有哪些要求？","异地证人可采用哪些现场、委托或远程询问方式？","治安案件办案期限、延长次数及不计入期限事项是什么？","复议机关对有权处理的规范性文件附带审查如何作出处理？","如何把裁量基准中的严重情形与本案事实进行涵摄？"],"sourceAnswer":"询问人员应出示人民警察证，笔录交被询问人核对或宣读并签名确认，书面材料请求原则上准许。异地询问可以在所在地进行、委托当地公安机关或远程视频进行。治安案件原则上自立案起 30 日，重大复杂案件经批准可延长 30 日，延长以两次为限，鉴定与听证期间不计入。复议机关有权处理裁量基准的，应在 30 日内审查并依合法与否分别告知或责令纠正。本案酒后偷开机动车符合严重情形，拘留 10 日并罚款 1,000 元在基准幅度内。","organizedAnswer":["询问人员出示警察证；笔录交被询问人核对，无阅读能力的予以宣读；允许补充更正，确认无误后由被询问人及询问人员签名，并可提交书面材料。","可到证人单位、住处或其提出的地点询问，也可通知其到公安机关；还可委托所在地公安机关，或通过公安视频系统远程询问并同步录音录像。","办案期限原则上 30 日，重大复杂经上一级公安机关批准延长 30 日，延长以两次为限；鉴定和听证期间不计入。","乙区政府作为复议机关对区公安分局制定的裁量基准有权处理，应在 30 日内审查；合法的在复议决定中告知，违法的停止执行并责令纠正。","将酒后偷开机动车事实对应基准中的严重情形，10 日拘留和 1,000 元罚款均在规定幅度内。"],"pitfall":"只写酒驾实体责任，遗漏题目要求的调查程序。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5337160141767580.html","answerUrl":"https://www.sina.cn/news/detail/5337326235422390.html","verifiedAt":"2026-08-31","shelf":"2026 每日一题","year":2026,"coreAnswer":"询问人员应出示人民警察证，笔录交被询问人核对或宣读并签名确认，书面材料请求原则上准许。异地询问可以在所在地进行、委托当地公安机关或远程视频进行。治安案件原则上自立案起 30 日，重大复杂案件经批准可延长 30 日，延长以两次为限，鉴定与听证期间不计入。复议机关有权处理裁量基准的，应在 30 日内审查并依合法与否分别告知或责令纠正。本案酒后偷开机动车符合严重情形，拘留 10 日并罚款 1,000 元在基准幅度内。 询问人员出示警察证；笔录交被询问人核对，无阅读能力的予以宣读；允许补充更正，确认无误后由被询问人及询问人员签名，并可提交书面材料。 可到证人单位、住处或其提出的地点询问，也可通知其到公安机关；还可委托所在地公安机关，或通过公安视频系统远程询问并同步录音录像。 办案期限原则上 30 日，重大复杂经上一级公安机关批准延长 30 日，延长以两次为限；鉴定和听证期间不计入。 乙区政府作为复议机关对区公安分局制定的裁量基准有权处理，应在 30 日内审查；合法的在复议决定中告知，违法的停止执行并责令纠正。 将酒后偷开机动车事实对应基准中的严重情形，10 日拘留和 1,000 元罚款均在规定幅度内。","note":"答案核验状态：已核验。","completeQuestion":"2026 年 2 月 7 日，董某酒后偷开邻居冯某的奥迪汽车上路。甲市公安局乙区分局接 eacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"原告资格、债权人与行政处罚","title":"第 11 题｜债权人能否起诉对茶企的处罚","questionSummary":"市场监管局因代用茶配料重复标注处罚销售商；生产商起诉，销售商作为第三人。题目综合考查原告资格、听证、法律适用、免责、上诉与遗漏第三人。","questionText":"区市场监管局检查发现泰和堂公司销售云雾山公司生产的代用茶，产品配料栏同时标注“山梨酸钾”和“保鲜剂（山梨酸钾）”。监管局认定构成重复标注，没收违法所得 711.5 元并罚款 29,288.5 元。生产商云雾山公司不服并起诉，法院通知销售商泰和堂公司作为第三人。当地规定对法人处以 2 万元以上罚款应告知听证权；食品安全法对不影响安全且不误导消费者的标签瑕疵，以及已经履行进货查验义务的经营者分别设有处理规则。\n\n请回答：\n1. 云雾山公司是否具有原告资格？\n2. 监管局未经听证程序即作出处罚是否合法？\n3. 将重复标注按一般违法处以 2.9 万元罚款，是否存在实体违法？\n4. 泰和堂能够证明已经履行进货查验义务且不知道标签问题时，能否免予处罚？\n5. 一审法院将罚款变更为 2,000 元，原被告均不上诉，第三人泰和堂能否独立上诉？\n6. 一审遗漏应当参加诉讼的第三人，二审法院如何处理？","trainingQuestions":["生产商与对销售商的处罚是否具有法律上的利害关系？","较大数额罚款是否应告知听证权？","重复标注属于一般标签违法还是不误导消费者的标签瑕疵？","履行进货查验义务的经营者能否免罚？","行政诉讼第三人能否独立上诉？","一审遗漏第三人时二审如何处理？"],"sourceAnswer":"生产商可依利害关系取得原告资格。法人罚款超过当地听证标准而未告知听证权，程序违法。重复标注若不影响食品安全且不误导消费者，应适用标签瑕疵条款，原罚款存在适用法律错误。经营者已尽进货查验义务并如实说明来源的，可以免罚。行政诉讼第三人具有独立诉讼地位，可以上诉；一审遗漏第三人的，二审应撤销原判并发回重审。","organizedAnswer":["云雾山公司是涉案商品生产商，处罚对产品违法定性直接影响其权益，且难以通过与销售商之间的民事诉讼消除该行政定性，可论证具有原告资格。","2.9 万元超过当地法人较大数额罚款门槛，处罚前应告知听证权；仅书面调查即作出处罚构成程序违法。","配料重复标注若不影响安全且不会误导消费者，属于标签瑕疵，应先责令改正，拒不改正时才在法定较低幅度内处罚。","泰和堂已履行进货查验、确不知情并能说明来源时，符合食品安全法免罚条件。","第三人属于行政诉讼当事人，可独立上诉；遗漏当事人属于严重程序问题，二审撤销并发回重审。"],"pitfall":"把生产商误写成一般债权人；遗漏听证数额标准、标签瑕疵特别规则和第三人的独立诉讼地位。","answerState":"已核验·有分歧","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5336797753117125.html","answerUrl":"https://www.sina.cn/news/detail/5336963848079608.html","verifiedAt":"2026-08-31","shelf":"2026 每日一题","year":2026,"coreAnswer":"生产商可依利害关系取得原告资格。法人罚款超过当地听证标准而未告知听证权，程序违法。重复标注若不影响食品安全且不误导消费者，应适用标签瑕疵条款，原罚款存在适用法律错误。经营者已尽进货查验义务并如实说明来源的，可以免罚。行政诉讼第三人具有独立诉讼地位，可以上诉；一审遗漏第三人的，二审应撤销原判并发回重审。 云雾山公司是涉案商品生产商，处罚对产品违法定性直接影响其权益，且难以通过与销售商之间的民事诉讼消除该行政定性，可论证具有原告资格。 2.9 万元超过当地法人较大数额罚款门槛，处罚前应告知听证权；仅书面调查即作出处罚构成程序违法。 配料重复标注若不影响安全且不会误导消费者，属于标签瑕疵，应先责令改正，拒不改正时才在法定较低幅度内处罚。 泰和堂已履行进货查验、确不知情并能说明来源时，符合食品安全法免罚条件。 第三人属于行政诉讼当事人，可独立上诉；遗漏当事人属于严重程序问题，二审撤销并发回重审。","note":"答案核验状态：已核验·有分歧。","completeQuestion":"区市场监管局检查发现泰和堂公司销售云雾山公司生产的代 ,"subject":"行政法","topic":"行政许可撤销、资格限制","title":"第 10 题｜骗领驾驶证被撤销并三年禁申","questionSummary":"申请人以欺骗手段取得驾驶证，行政机关撤销许可并告知三年内不得再次申请。两项后果的性质如何判断？","questionText":"崔某以作弊方式取得驾驶证。某市交警大队发现后撤销其驾驶证，并禁止崔某三年内参加驾考、再次申请驾驶证。崔某申请行政复议；市政府经审理认为其复议请求不成立，驳回复议请求。崔某不服并提起行政诉讼。\n\n请回答：\n1. 撤销驾驶证是否属于行政处罚？\n2. 三年内禁止参加驾考、申请驾驶证是什么性质？\n3. 本案行政诉讼被告应如何确定？","trainingQuestions":["因作弊取得许可而撤销是否具有行政处罚的惩戒性？","三年禁申是否属于行为罚？","复议机关驳回复议请求是否构成复议维持，谁是共同被告？"],"sourceAnswer":"因欺骗取得许可而撤销，是许可纠错机制，并非当然属于行政处罚；三年禁申是法律规定的资格限制后果，应分别审查依据。","organizedAnswer":["撤销针对原许可取得违法，功能是纠正违法授益行为。","是否构成处罚取决于规范定性与惩戒性，不能只看不利后果。","三年禁申须有明确法律依据，并审查告知、听取意见等程序。"],"pitfall":"把撤销许可与吊销许可证混为同一种处罚。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5336435365252898.html","answerUrl":"https://www.sina.cn/news/detail/5336601460477169.html","verifiedAt":"2026-08-31","shelf":"2026 每日一题","year":2026,"coreAnswer":"因欺骗取得许可而撤销，是许可纠错机制，并非当然属于行政处罚；三年禁申是法律规定的资格限制后果，应分别审查依据。 撤销针对原许可取得违法，功能是纠正违法授益行为。 是否构成处罚取决于规范定性与惩戒性，不能只看不利后果。 三年禁申须有明确法律依据，并审查告知、听取意见等程序。","note":"答案核验状态：已核验。","completeQuestion":"崔某以作弊方式取得驾驶证。某市交警大队发现后撤销其驾驶证，并禁止崔某三年内参加驾考、再次申请驾驶证。崔某申请行政复议；市政府经审理认为其复议请求不成立，驳回复议请求。崔某不服并提起行政诉讼。\n\n请回答：\n1. 撤销驾驶证是否属于行政处罚？\n2. 三年内禁止参加驾考、申请驾驶证是什么性质？\n3. 本案行政诉讼被告应如何确定？","completeAnswer":{"conclusion":"因欺骗取得许可而撤销，是许可纠错机制，并非当然属于行政处罚；三年禁申是法律规定的资格限制后果，应分别审查依据。 撤销针对原许可取得违法，功能是纠正违法授益行为。 是否构成处罚取决于规范定性与惩戒性，不能只看不利后果。 三年禁申须有明确法律依据，并审查告知、听取意见等程序。","rules":["行政许可的不利变动应依原因区分撤销、撤回、注销与吊销：违法取得通常进入撤销，依据变化或公共利益需要可能适用撤回，法定终止情形适用注销，具有惩戒性的吊销属于行政处罚；既有许可还涉及法不溯及既往与信赖保护。"],"application":"1. 撤销针对原许可取得违法，功能是纠正违法授益行为。\n2. 是否构成处罚取决于规范定性与惩戒性，不能只看不利后果。\n3. 三年禁申须有明确法律依据，并审查告知、听取意见等程序。","branches":"如公开回忆或教师解析存在不同观点，先写通说或更有评分可能的观点，再说明另一观点的规范理由。无论采用何种观点，前提、规则、涵摄与结论必须一致。","conciseSummary":["核心争点：行政许可撤销、资格限制。","结论要旨：因欺骗取得许可而撤销，是许可纠错机制，并非当然属于行政处罚；三年禁申是法律规定的资格限制后果，应分别审查依据。 撤销针对原许可取得违法，功能是纠正违法授益行为。 是否构成处罚取决于规范定性与惩戒性，不能只看不利后果。 三年禁申须有明确法律依据，并审查告知、听取意见等程序。","落笔顺序：结论先行—规范依据—事实涵摄—争议分支—最终结论。"]},"completeness":{"label":"回忆资料已结构化","tone":"verified"}},{"id":"2026-lijia-09","date":"2026-08-26","institution":"方圆众合","teacher":"李佳","platform":"微博公开页（新浪镜像）","subject":"行政法","topic":"机构职权变更、被告变更、裁判方式","title":"第 9 题｜预售许可争议中机构职权调整","questionSummary":"当事人起诉商品房预售许可机关后，相关职权发生调整；法院告知变更被告而原告拒绝。法院如何处理？","questionText":"2017 年 1 月，县建设局向华源小区开发商甲颁发商品房预售许可证，许可销售一定面积的地下车位。小区业主林某在开发商开始销售车位时得知许可，认为相关车位和人防工程依法应当服务全体业主，建设局无权许可开发商出售，遂提起行政诉讼。其间，房产预售、登记职权已经由县建设局调整至县国土资源局。法院告知林某变更被告，林某拒绝；开发商甲作为第三人参加诉讼。\n\n请回答：\n1. 林某拒绝变更被告后，法院应当如何处理？\n2. 林某作为小区业主是否具有原告资格？\n3. 若行政机关未举证或逾期举证，第三人开发商甲能否提供证明预售许可合法的证据？","trainingQuestions":["行政职权变更后谁承受被告资格，原告拒绝变更时法院如何裁定？","小区业主与车位预售许可是否具有法律上的利害关系？","被告怠于举证时第三人能否提交证据？"],"sourceAnswer":"行政职权变更后由继续行使该职权的机关承受诉讼责任；经释明原告拒绝变更错误被告的，可裁定驳回起诉。","organizedAnswer":["先查职权调整文件，确定现由哪个机关继续行使涉案职权。","法院应释明并给予原告变更被告的机会。","原告无正当理由拒绝变更，起诉不符法定条件，裁定驳回。"],"pitfall":"直接判决驳回诉讼请求，混淆实体裁判和起诉条件。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5336072978171749.html","answerUrl":"https://www.sina.cn/news/detail/5336239072611479.html","verifiedAt":"2026-08-31","shelf":"2026 每日一题","year":2026,"coreAnswer":"行政职权变更后由继续行使该职权的机关承受诉讼责任；经释明原告拒绝变更错误被告的，可裁定驳回起诉。 先查职权调整文件，确定现由哪个机关继续行使涉案职权。 法院应释明并给予原告变更被告的机会。 原告无正当理由拒绝变更，起诉不符法定条件，裁定驳回。","note":"答案核验状态：已核验。","completeQuestion":"2017 年 1 月，县建设局向华源小区开发商甲颁发商品房预售许可证，许可销售一定面积的地下车位。小区业主林某在开发商开始销售车位时得知许可，认为相关车位和人防工程依法应当服务全体业主，建设局无权许可开发商出售，遂提起行政诉讼。其间，房产预售、登记职权已经由县建设局调整至县国土资源局。法院告知林某变更被告，林某拒绝；开发商甲作为第三人参加诉讼。\n\n请回答：\n1. 林某拒绝变更被告后，法院应当如何处理？\n2. 林某作为小区业主是否具有原告资格？\n3. 若行政机关未举证或逾期举证，第三人开发商甲能否提供证明预售许可合法的证据？","completeAnswer":{"conclusion":"行政职权变更后由继续行使该职权的机关承受诉讼责任；经释明原告拒绝变更错误被告的，可裁定驳回起诉。 先查职权调整文件，确定现由哪个机关继续行使涉案职权。 法院应释明并给予原告变更被告的机会。 原告无正当理由拒绝变更，起诉不符法定条件，裁定驳回。","rules":["行政主体与诉讼被告不能只看文件名称。法律、法规或规章授权的组织以自己名义承担责任；行政委托由委托机关承担责任；职权调整后原则上由继续行使职权的机关承受诉讼责任。"],"application":"1. 先查职权调整文件，确定现由哪个机关继续行使涉案职权。\n2. 法院应释明并给予原告变更被告的机会。\n3. 原告无正当理由拒绝变更，起诉不符法定条件，裁定驳回。","branches":"如公开回忆或教师解析存在不同观点，先写通说或更有评分可能的观点，再说明另一观点的规范理由。无论采用何种观点，前提、规则、涵摄与结论必须一致。","conciseSummary":["核心争点：机构职权变更、被告变更、裁判方式。","结论要旨：行政职权变更后由继续行使该职权的机关承受诉讼责任； 名义作出答复时，可独立作为被告。","行政机关逾期未答复的，以收到申请的行政机关即区政府为被告。","复议前置限于国家秘密及安全稳定、商业秘密和个人隐私、内部事务、过程性信息及行政执法案卷等不予公开决定；信息不存在不在其中。","起诉状副本送达被告后，原告新增诉讼请求原则上不予准许，但有正当理由的除外。"],"pitfall":"只看落款，不判断组织法地位。","answerState":"已核验","confidence":"公开账号·已核验","sourceUrl":"https://www.sina.cn/news/detail/5334623426445879.html","answerUrl":"https://www.sina.cn/news/detail/5334789520885344.html","verifiedAt":"2026-08-31","shelf":"2026 每日一题","year":2026,"coreAnswer":"已经答复的，以自己名义作出答复的政务公开办公室为被告；逾期不答复的，以收到申请的区政府为被告。“信息不存在”不属于法定的四类信息公开复议前置事项，可直接起诉。庭审中无正当理由新增另一项公开请求，法院不予准许。 政府信息公开司法解释对指定工作机构设置特别被告规则：该机构以自己名义作出答复时，可独立作为被告。 行政机关逾期未答复的，以收到申请的行政机关即区政府为被告。 复议前置限于国家秘密及安全稳定、商业秘密和个人隐私、内部事务、过程性信息及行政执法案卷等不予公开决定；信息不存在不在其中。 起诉状副本送达被告后，原告新增诉讼请求原则上不予准许，但有正当理由的除外。","note":"答案核验状态：已核验。","completeQuestion":"2025 年 6 月 16 日，王某邮寄申请区政府公开某棚户区改造项目的地上物现状调查册，区政府次日收到申请。6 月 30 日，区政府指定的政务公开办公室以自己名义作出答复，告知申请信息不存在，并加盖该办公室印章。王某不服，提起行政诉讼，请求判令公开该调查册；庭审中又提出要求公开土地价格评估报告。\n\n请回答：\n1. 针对已经作出的答复，谁是本案被告？\n2. 若收到申请后逾期未答复，谁是被告？\n3. “信息不存在”答复是否必须先复议再起诉？\n4. 王某在庭审中新增公开另一份材料的请求，法院应如何处理？","completeAnswer":{"conclusion":"已经答复的，以自己名义作出答复的政务公开办公室为被告；逾期不答复的，以收到申请的区政府为被告。“信息不存在”不属于法定的四类信息公开复议前置事项，可直接起诉。庭审中无正当理由新增另一项公开请求，法院不予准许。 政府信息公开司法解释对指定工作机构设置特别被告规则：该机构以自己名义作出答复时，可独立作为被告。 行政机关逾期未答复的，以收到申请的行政机关即区政府为被告。 复议前置限于国家秘密及安全稳定、商业秘密和个人隐私、内部事务、过程性信息及行政执法案卷等不予公开决定；信息不存在不在其中。 起诉状副本送达被告后，原告新增诉讼请求原则上不予准许，但有正当理由的除外。","rules":["政府信息公开案件应先判断申请对象是否属于行政机关在履职中制作、获取并保存的信息，再审查主动公开、依申请公开、不予公开和信息不存在等答复类型。答复机关负有检索、说明理由和遵守期限的义务；救济路径还要单独判断是否属于行政复议前置。"],"application":"1. 政府信息公开司法解释对指定工作机构设置特别被告规则：该机构以自己名义作出答复时，可独立作为被告。\n2. 行政机关逾期未答复的，以收到申请的行政机关即区政府为被告。\n3. 复议前置限于国家秘密及安全稳定、商业秘密和个人隐私、内部事务、过程性信息及行政执法案卷等不予公开决定；信息不存在不在其中。\n4. 起诉状副本送达被告后，原告新增诉讼请求原则上不予准许，但有正当理由的除外。","branches":"如公开回忆或教师解析存在不同观点，先写通说或更有评分可能的观点，再说明另一观点的规范理由。无论采用何种观点，前提、规则、涵摄与结论必须一致。","conciseSummary":["核心争点：政府信息公开、机构名义。","结论要旨：已经答复的，以自己名义作出答复的政务公开办公室为被告；逾期不答复的，以收到申请的区政府为被告。“信息不存在”不属于法定的四类信息公开复议前置事项，可直接起诉。庭审中无正当理由新增另一项公开请求，法院不予准许。 政府信息公开司法解释对指定工作机构设置特别被告规则：该机构以自己名义作出答复时，可独立作为被告。 行政机关逾期未答复的，以收到申请的行政机关即区政府为被告。 复议前置限于国家秘密及安全稳定         '<nav class="desktop-nav" aria-label="资料库主导航">'+navItems.map((item) => '<button data-view="'+item[0]+'" class="'+(state.view === item[0] ? "active" : "")+'">'+item[1]+'</button>').join("")+'</nav>'+

    function overview() {
      const connected = channels.filter((item) => item.status.includes("接入") || item.status.includes("追踪")).length;
      const p0 = channels.filter((item) => item.priority === "P0");
      return '<div class="overview" id="top"><section class="hero-panel"><div class="hero-copy"><p class="kicker">2026 法考主观题备考中枢</p><h1>收得全，<br><em>核得准。</em></h1><p>每日一题、法治思想带背和近十年真题统一归档。每条资料都标明题型、来源、核验层级与答案性质，后续新增老师和平台无需重做网页。</p><div class="hero-actions"><button class="primary-button" data-view="daily">开始今日训练 <span>→</span></button><button class="secondary-button" data-view="recitation">背十二个坚持</button></div></div><aside class="countdown-card"><div class="countdown-label"><span>考试倒计时</span><small>司法部公告已核验</small></div><strong>'+examDays+'</strong><p>天</p><div class="exam-meta"><span>10 月 18 日</span><span>240 分钟</span><span>计算机化考试</span></div><a href="https://www.chinalaw.gov.cn/jgsz/jgszzsdw/zsdwgjsfkszx/" target="_blank" rel="noreferrer">查看司法部考试中心 ↗</a></aside></section>'+
        '<section class="metric-grid" aria-label="资料库统计"><button data-view="daily"><span>01</span><strong>'+pureDaily.length+'<i>+'+convertedDaily.length+'</i></strong><p>纯主观 / 主观化训练</p><small>李佳第 1—13 题已逐题定位</small></button><button data-view="recitation"><span>02</span><strong>'+recitations.length+'</strong><p>法治思想带背专题</p><small>已按十二个坚持更新</small></button><button data-view="history"><span>03</span><strong>'+history.length+'</strong><p>历年分题训练</p><small>覆盖 2016—2025</small></button><button data-view="channels"><span>04</span><strong>'+connected+'/'+channels.length+'</strong><p>已接入 / 全部渠道</p><small>保留后续扩展位</small></button></section>'+
        '<section class="dashboard-grid"><article class="focus-card update-card"><div class="section-cap"><span>2026 重要更新</span><small>必须改背</small></div><p class="update-number">12</p><h2>“十一个坚持”已更新为“十二个坚持”</h2><p>新增“坚持依法治国和依规治党有机统一”；第五项更新为“坚持在法治轨道上全面建设社会主义现代化国家”。</p><button data-view="recitation">打开新增必背专题 →</button></article><article class="focus-card workflow-card"><div class="section-cap"><span>资料入库流程</span><small>每条可追溯</small></div><ol><li><b>发现</b><span>机构、老师、平台与公开转载</span></li><li><b>定位</b><span>原题、公布答案与单篇链接</span></li><li><b>核验</b><span>题型、事实、结论和发布时间</span></li><li><b>整理</b><span>题面—设问—规则—涵摄—结论</span></li><li><b>发布</b><span>保留来源、版本和复核状态</span></li></ol></article><article class="focus-card channel-card"><div class="section-cap"><span>本周重点追踪</span><small>'+esc(data.channels.lastReviewed)+'</small></div><div class="channel-mini-list">'+p0.map((item) => '<div><span class="mini-status '+tone(item.status)+'"></span><p><strong>'+esc(item.teacher)+'</strong><small>'+esc(item.series)+'</small></p><em>'+esc(item.status)+'</em></div>').join("")+'</div><button data-view="channels">查看全部渠道与下次核验 →</button></article></section></div>';
    }

    function recordReader(record) {

        '<section class="reader-section prompt-section"><div class="reader-section-title"><span>01</span><h3>完整训练题面</h3><small>事实与设问完整保留，措辞经整理</small></div><p class="long-copy">'+esc(record.completeQuestion)+'</p></section>'+

    }

    function libraryWorkspace(mode) {
      const source = mode === "daily" ? daily : history;
      const selectedKey = mode === "daily" ? "selectedDaily" : "selectedHistory";
